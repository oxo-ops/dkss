name: Vehicle Comparison Browser Acceptance

on:
  pull_request:
    paths:
      - 'vehicle_comparison_presentation.py'
      - 'dkss_app/analysis.py'
      - 'templates/vehicle_karte_analysis.html'
      - 'templates/vehicle_karte_comparison_panels.html'
      - 'static/css/vehicle_comparison_panels.css'
      - 'tests/test_vehicle_comparison_panels.py'
      - 'tests/vehicle_comparison_browser/**'
      - '.github/workflows/vehicle-comparison-browser.yml'

permissions:
  contents: read

jobs:
  synthetic-ui5:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install application and pinned browser dependencies
        run: |
          python -m venv "$RUNNER_TEMP/ui5-venv"
          "$RUNNER_TEMP/ui5-venv/bin/python" -m pip install -r requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/ui5-venv/bin/python" -m playwright install --with-deps chromium
      - name: Record exact candidate
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/ui5-results"
          printf 'head=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" > "$RUNNER_TEMP/ui5-results/source-identity.txt"
      - name: Run synthetic real-browser acceptance with existing CSP
        shell: bash
        run: |
          set -euo pipefail
          chromium=$("$RUNNER_TEMP/ui5-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          bash tests/vehicle_comparison_browser/run-isolated.sh "$GITHUB_WORKSPACE" \
            "$RUNNER_TEMP/ui5-venv/bin/python" "$chromium" "$RUNNER_TEMP/ui5-results/browser" \
            2>&1 | tee "$RUNNER_TEMP/ui5-results/browser.log"
      - name: Preserve synthetic screenshots and results, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: vehicle-comparison-ui5-results
          path: ${{ runner.temp }}/ui5-results
