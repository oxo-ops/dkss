# Synthetic-only public review; no deployed resources or credentials.
name: Synthetic guide images
on:
  workflow_dispatch:
  push:
    branches: [review/video-ui-8868-20261118]
permissions:
  contents: read
jobs:
  ai-opened-state:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: bash tests/demo_guide/run.sh
        env:
          PRODUCT_REPO: ${{ github.workspace }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          ARTIFACTS: ${{ runner.temp }}/guide-images
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-guide-images-${{ github.sha }}
          path: |
            ${{ runner.temp }}/guide-images/*.png
            ${{ runner.temp }}/guide-images/report.json
            ${{ runner.temp }}/guide-images/inspection-guide-states.json

  summary-notification-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install jinja2 playwright==1.62.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/summary_mobile_browser.py --root . --output "$RUNNER_TEMP/summary-ui"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: summary-notification-ui-${{ github.sha }}
          path: ${{ runner.temp }}/summary-ui/

  inspection-calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          bash tests/inspection_calendar_browser/run.sh "$PWD" "$(command -v python)" "$RUNNER_TEMP/calendar-ui" "$CHROME"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: inspection-calendar-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/calendar-ui/*.png
            ${{ runner.temp }}/calendar-ui/report.json
