name: Guide blue coachmark isolated browser
on:
  push:
    branches: [review/guide-blue-coachmark-20261119]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exact candidate and synthetic route HTML
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/coachmark/html" "$RUNNER_TEMP/coachmark/images" "$RUNNER_TEMP/fixture-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/coachmark/html" TMPDIR="$RUNNER_TEMP/fixture-tmp" PYTHONPATH="$GITHUB_WORKSPACE/tests/history_presentation_browser/guard" DKSS_VALIDATION_TMP="$RUNNER_TEMP/fixture-tmp" python tests/demo_guide/render_pages.py > "$RUNNER_TEMP/coachmark/render.log" 2>&1
          env -i PATH="$PATH" HOME="$HOME" PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/coachmark/html" ARTIFACTS="$RUNNER_TEMP/coachmark/images" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node tests/guide_coachmark_browser/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guide-coachmark-${{ github.sha }}
          path: |
            ${{ runner.temp }}/coachmark/images/
            ${{ runner.temp }}/coachmark/render.log
          retention-days: 7
