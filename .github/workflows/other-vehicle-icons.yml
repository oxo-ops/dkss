name: Offline other vehicle icon assets
on:
  push:
    branches: ['review/other-vehicle-icons-20261119']
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==13.0.0
      - run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" PRODUCT_REPO="$PWD" OUTPUT="$RUNNER_TEMP/other-icons" python tests/other_vehicle_icons/generate.py
          git diff --exit-code
          git rev-parse HEAD > "$RUNNER_TEMP/other-icons/head.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: other-icons-${{ github.sha }}
          path: ${{ runner.temp }}/other-icons/
          retention-days: 14
