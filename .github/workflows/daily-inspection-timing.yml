name: Daily inspection isolated timing
on:
  push:
    branches: [diagnostic/daily-inspection-timing]
permissions:
  contents: read
jobs:
  timing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.62.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" AWS_EC2_METADATA_DISABLED=true PRODUCT_REPO="$PWD" DIAGNOSTIC_OUT="$RUNNER_TEMP/timing" python tests/daily_timing/render.py
          env -i PATH="$PATH" HOME="$HOME" PRODUCT_REPO="$PWD" DIAGNOSTIC_OUT="$RUNNER_TEMP/timing" PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright" node tests/daily_timing/browser.cjs
          git rev-parse HEAD > "$RUNNER_TEMP/timing/head.txt"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: daily-inspection-timing
          path: ${{ runner.temp }}/timing
