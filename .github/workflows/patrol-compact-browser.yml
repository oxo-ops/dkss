name: Patrol compact list isolated browser
on:
  push:
    branches: [validation/experience-followups, review/patrol-cohesive-spacing-20261120, validation/pitch-ready-ui, review/safety-records-mobile, validation/demo-ready-batch2-20261119, review/patrol-compact-20261119, validation/release-integrated-20261119, validation/patrol-space-live6ca]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exact candidate and synthetic route HTML
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/patrol-compact/html" "$RUNNER_TEMP/patrol-compact/images" "$RUNNER_TEMP/fixture-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/patrol-compact/html" TMPDIR="$RUNNER_TEMP/fixture-tmp" PYTHONPATH="$GITHUB_WORKSPACE/tests/history_presentation_browser/guard" DKSS_VALIDATION_TMP="$RUNNER_TEMP/fixture-tmp" python tests/patrol_compact_browser/render.py > "$RUNNER_TEMP/patrol-compact/render.log" 2>&1
          env -i PATH="$PATH" HOME="$HOME" PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/patrol-compact/html" ARTIFACTS="$RUNNER_TEMP/patrol-compact/images" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node tests/patrol_compact_browser/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guide-patrol-compact-${{ github.sha }}
          path: |
            ${{ runner.temp }}/patrol-compact/images/
            ${{ runner.temp }}/patrol-compact/render.log
          retention-days: 7
