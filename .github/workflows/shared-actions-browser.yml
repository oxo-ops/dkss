name: Shared action appearance review
on:
  workflow_dispatch:
  push:
    branches: [review/shared-actions-20261118]
permissions:
  contents: read
jobs:
  shared-actions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          mkdir -p "$RUNNER_TEMP/browser"
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: bash tests/shared_actions_browser/run.sh
        env:
          PRODUCT_REPO: ${{ github.workspace }}
          EXPECTED_SHA: ${{ github.sha }}
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
          ARTIFACTS: ${{ runner.temp }}/shared-actions
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-actions-${{ github.sha }}
          path: |
            ${{ runner.temp }}/shared-actions/*.png
            ${{ runner.temp }}/shared-actions/*report.json
            ${{ runner.temp }}/shared-actions/html/coverage.json
