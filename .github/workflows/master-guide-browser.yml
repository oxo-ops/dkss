name: Nine master guides browser
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/master_guide_browser/**'
      - '.github/workflows/master-guide-browser.yml'
permissions:
  contents: read
jobs:
  synthetic-admin-master-guide:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install Chromium for isolated checks
        run: |
          npm install --prefix "$RUNNER_TEMP/master-guide-node" playwright@1.62.0
          "$RUNNER_TEMP/master-guide-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Candidate master help and control geometry
        env:
          PRODUCT_REPO: ${{ github.workspace }}
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
          ARTIFACTS: ${{ runner.temp }}/master-guide-output
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/master-guide-node/node_modules/playwright
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          bash tests/master_guide_browser/run.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: master-guide-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/master-guide-output/
          retention-days: 7
