name: Demo Notification Labels Isolated Browser
on:
  push:
    branches: [validation/demo-ready-batch2-20261119, validation/demo-notification-labels]
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
      - run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python -m unittest tests.test_demo_notification_labels tests.test_demo_label_display
          mkdir -p "$RUNNER_TEMP/labels/html" "$RUNNER_TEMP/labels/images" "$RUNNER_TEMP/labels/tmp"
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/labels/html" TMPDIR="$RUNNER_TEMP/labels/tmp" PYTHONPATH="$GITHUB_WORKSPACE/tests/history_presentation_browser/guard" DKSS_VALIDATION_TMP="$RUNNER_TEMP/labels/tmp" python tests/demo_notification_browser/render.py
          env -i PATH="$PATH" HOME="$HOME" PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/labels/html" ARTIFACTS="$RUNNER_TEMP/labels/images" python tests/demo_notification_browser/browser.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-notification-labels-${{ github.sha }}
          path: ${{ runner.temp }}/labels/images/
          retention-days: 7
