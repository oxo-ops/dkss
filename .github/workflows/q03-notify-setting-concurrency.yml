name: Q03 Reminder Setting Concurrency

on:
  pull_request:
    paths:
      - 'dkss_app/safety_identity.py'
      - 'dkss_app/safety_permissions.py'
      - 'dkss_app/checklists.py'
      - 'dkss_app/checklist_common.py'
      - 'dkss_app/safety.py'
      - 'dkss_app/models.py'
      - 'dkss_app/database.py'
      - 'tests/test_q03*.py'
      - '.github/workflows/q03-notify-setting-concurrency.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-notify-setting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q03_test
          POSTGRES_USER: q03_test
          POSTGRES_PASSWORD: q03-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q03_test -d dkss_q03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      Q04_POSTGRES_TEST_URL: postgresql+psycopg2://q03_test:q03-disposable-ci-only@127.0.0.1:5432/dkss_q04_ci
      Q04_REQUIRE_POSTGRES: '1'
      Q03_POSTGRES_TEST_URL: postgresql+psycopg2://q03_test:q03-disposable-ci-only@127.0.0.1:5432/dkss_q03_test
      AWS_EC2_METADATA_DISABLED: 'true'
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      PYTHONPATH: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Create a second disposable database for master lock acceptance
        run: |
          python - <<'PY'
          import psycopg2
          from sqlalchemy.engine import make_url
          import os
          url = make_url(os.environ['Q03_POSTGRES_TEST_URL'])
          connection = psycopg2.connect(host=url.host, port=url.port, user=url.username,
                                       password=url.password, dbname=url.database)
          connection.autocommit = True
          with connection.cursor() as cursor:
              cursor.execute('CREATE DATABASE dkss_q04_ci')
          connection.close()
          PY
      - run: python -m unittest test_q03_notify_setting_concurrency -v
