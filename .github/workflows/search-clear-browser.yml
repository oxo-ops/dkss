name: Search Clear Browser
on:
  push:
    branches: [validation/search-clear-20261119, validation/release-integrated-20261119, validation/search-master-batch-20261119]
permissions:
  contents: read
jobs:
  search-clear:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: bash tests/search_clear_browser/run.sh
        env:
          PRODUCT_REPO: ${{ github.workspace }}
          EXPECTED_SHA: ${{ github.sha }}
          ARTIFACTS: ${{ runner.temp }}/search-clear-ui
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: search-clear-ui-${{ github.sha }}
          path: |
            ${{ runner.temp }}/search-clear-ui/*.png
            ${{ runner.temp }}/search-clear-ui/*.json
            ${{ runner.temp }}/search-clear-ui/source-sha.txt
