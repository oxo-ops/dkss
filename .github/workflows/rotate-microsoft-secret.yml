name: Rotate Microsoft Client Secret

on:
  workflow_dispatch:

  schedule:
    - cron: "0 3 1 * *"

permissions:
  id-token: write
  contents: read

jobs:
  rotate-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Microsoft Entra
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Get Microsoft Graph token
        id: graph-token
        shell: bash
        run: |
          TOKEN=$(az account get-access-token \
            --resource-type ms-graph \
            --query accessToken \
            -o tsv)

          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Create new DKSS Notification client secret
        id: create-secret
        shell: bash
        env:
          GRAPH_TOKEN: ${{ steps.graph-token.outputs.token }}
        run: |
          RESPONSE=$(curl --fail-with-body \
            -X POST \
            "https://graph.microsoft.com/v1.0/applications/d7eb5926-21d1-44c8-882a-1bf89664b313/addPassword" \
            -H "Authorization: Bearer $GRAPH_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{
              "passwordCredential": {
                "displayName": "DKSS automatic rotation"
              }
            }')

          NEW_SECRET=$(echo "$RESPONSE" | jq -r '.secretText')

          if [ -z "$NEW_SECRET" ] || [ "$NEW_SECRET" = "null" ]; then
            echo "Microsoft Graph did not return secretText."
            exit 1
          fi

          echo "::add-mask::$NEW_SECRET"
          echo "secret=$NEW_SECRET" >> "$GITHUB_OUTPUT"

      - name: Update Render Microsoft secret
        shell: bash
        env:
          NEW_SECRET: ${{ steps.create-secret.outputs.secret }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body \
            -X PUT \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars/MICROSOFT_CLIENT_SECRET" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg value "$NEW_SECRET" '{value: $value}')"

      - name: Deploy Render service
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          curl --fail-with-body \
            -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{}'