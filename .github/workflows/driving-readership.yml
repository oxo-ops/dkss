name: Driving Verified Readership

on:
  pull_request:
    paths:
      - 'dkss_app/driving_access.py'
      - 'driving_identity_resolution.py'
      - 'driving_report_management.py'
      - 'templates/driving*.html'
      - 'tests/driving_identity_fixture.py'
      - 'tests/test_driving*.py'
      - '.github/workflows/driving-readership.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readership:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q08_ci
          POSTGRES_USER: q08
          POSTGRES_PASSWORD: q08-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q08 -d dkss_q08_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .:tests
      Q08_POSTGRES_TEST_URL: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q08_ci
      Q03_POSTGRES_TEST_URL: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q03_test
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare the additional disposable Q03 database
        env:
          PGPASSWORD: q08-disposable-ci-only
        run: createdb -h 127.0.0.1 -U q08 dkss_q03_test
      - name: Verify both databases and preserved Q08 and Q03 contracts
        run: |
          python -m unittest -v \
            test_driving_verified_readership \
            test_driving_reader_generation \
            test_driving_pending_identity_recovery \
            test_q08_driving_generation.DrivingGenerationTests \
            test_q08_postgres_driving_generation.PostgresDrivingGenerationTests \
            test_driving_identity_resolution.DrivingIdentityTests.test_normal_import_automatically_persists_identity_with_no_extra_field \
            test_q03_account_generations.CombinedIdentityTests.test_same_generation_rename_unlock_and_company_boundary_match_both_permissions \
            test_q03_account_generations.CombinedIdentityTests.test_explicit_same_numeric_id_does_not_transfer_personal_rights_or_history \
            test_q03_account_generations.CombinedPostgresIdentityTests.test_same_generation_rename_unlock_and_company_boundary_match_both_permissions \
            test_q03_account_generations.CombinedPostgresIdentityTests.test_explicit_same_numeric_id_does_not_transfer_personal_rights_or_history
