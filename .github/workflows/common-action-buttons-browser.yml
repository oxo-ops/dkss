name: Common action buttons isolated browser
on:
  push:
    branches: [review/common-action-buttons-20261120]
permissions:
  contents: read
jobs:
  styles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          PRODUCT_REPO="$GITHUB_WORKSPACE" ARTIFACTS="$RUNNER_TEMP/action-buttons" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node tests/common_action_buttons/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: action-buttons-${{ github.sha }}
          path: ${{ runner.temp }}/action-buttons/
          retention-days: 7
