name: Annual PDF Isolated Render
on:
  push:
    branches: [validation/annual-pdf-render-20261119]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install jinja2==3.1.6 reportlab==4.4.9
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          python tests/annual_pdf_render/prepare.py
          node tests/annual_pdf_render/browser.cjs "$RUNNER_TEMP/qa"
          git rev-parse HEAD > "$RUNNER_TEMP/qa/source-sha.txt"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: annual-pdf-render-${{ github.sha }}
          path: ${{ runner.temp }}/qa
