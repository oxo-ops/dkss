name: Frozen Quality Feature Browser Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/quality_feature_browser/**'
      - '.github/workflows/quality-feature-browser.yml'

permissions:
  contents: read

concurrency:
  group: quality-feature-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    if: github.event.pull_request.number == 361 && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out frozen application candidate
        uses: actions/checkout@v7
        with:
          ref: 3ca0f38e36f47ad94a625e71492bedbdd2f11841
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check out this PR's validation harness separately
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: validation
          persist-credentials: false
          sparse-checkout: tests/quality_feature_browser
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated application and pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r candidate/requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Verify frozen source and run synthetic browser acceptance once
        shell: bash
        env:
          DKSS_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/quality-feature-browser-results/browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/quality-feature-browser-results"
          test "$(git -C candidate rev-parse HEAD)" = 3ca0f38e36f47ad94a625e71492bedbdd2f11841
          test "$(git -C candidate rev-parse HEAD^{tree})" = cc05950a0ef99241ac1a80b320ddcafd0944c710
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          printf 'candidate=%s\nvalidation=%s\n' "$(git -C candidate rev-parse HEAD)" "$(git -C validation rev-parse HEAD)" > "$RUNNER_TEMP/quality-feature-browser-results/source-identity.txt"
          chromium=$("$RUNNER_TEMP/browser-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$chromium"
          bash "$GITHUB_WORKSPACE/validation/tests/quality_feature_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --chromium "$chromium" \
            2>&1 | tee "$RUNNER_TEMP/quality-feature-browser-results/browser.log"
      - name: Save synthetic browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: quality-feature-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/quality-feature-browser-results/
          if-no-files-found: warn
          retention-days: 14
