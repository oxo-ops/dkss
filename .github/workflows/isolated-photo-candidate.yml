name: Isolated photo candidate (synthetic only)
on:
  push:
    branches: ['validation/photo-isolated-20261118']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-sqlite:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Test with cleared environment and remote sockets blocked
        run: python -B ci/run_photo_candidate.py
