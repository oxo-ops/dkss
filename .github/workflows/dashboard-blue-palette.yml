name: Dashboard Blue Color Only
on:
  push:
    branches: [validation/dashboard-blue-colors-20261120]
permissions:
  contents: read
jobs:
  palette:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - run: |
          mkdir -p "$PALETTE_QA_ROOT/original/static/css" "$PALETTE_QA_ROOT/candidate/static/css"
          for file in style.css dashboard_safety_attention.css dashboard_mobile_refinement.css video_proposal_lists.css dashboard_summary_mobile.css; do
            git show 463894aac8cad65b9b28ffe0a1d354359b1d1050:static/css/$file > "$PALETTE_QA_ROOT/original/static/css/$file"
            cp static/css/$file "$PALETTE_QA_ROOT/candidate/static/css/$file"
          done
          cp static/css/dashboard_blue_palette.css "$PALETTE_QA_ROOT/palette.css"
          python tests/dashboard_blue_palette.py
          git rev-parse HEAD > "$PALETTE_QA_ROOT/source-sha.txt"
        env:
          PALETTE_QA_ROOT: ${{ runner.temp }}/palette-qa
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dashboard-blue-palette
          path: |
            ${{ runner.temp }}/palette-qa/*.png
            ${{ runner.temp }}/palette-qa/*.json
            ${{ runner.temp }}/palette-qa/source-sha.txt
