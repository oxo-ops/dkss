name: Frozen Priority Condition Browser Acceptance

on:
  pull_request:
    branches: ['verify/quality-feature-20261110']
    types: [opened, synchronize]
    paths:
      - 'tests/priority_condition_browser/**'
      - '.github/workflows/priority-condition-browser.yml'

permissions:
  contents: read

concurrency:
  group: priority-condition-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    if: github.repository == 'oxo-ops/dkss' && github.event.pull_request.head.repo.full_name == 'oxo-ops/dkss' && github.event.pull_request.head.ref == 'verify/priority-condition-browser-20261110' && github.event.pull_request.base.ref == 'verify/quality-feature-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen application candidate
        uses: actions/checkout@v7
        with:
          ref: f0005bb4a7fe7b8674f4dfe1f319228ac4de1089
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check out this PR's validation harness separately
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: validation
          persist-credentials: false
          sparse-checkout: tests/priority_condition_browser
      - name: Verify exact source identities before dependency installation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/priority-condition-browser-results"
          printf 'candidate=%s\ntree=%s\nvalidation=%s\n' \
            "$(git -C candidate rev-parse HEAD)" \
            "$(git -C candidate rev-parse HEAD^{tree})" \
            "$(git -C validation rev-parse HEAD)" \
            > "$RUNNER_TEMP/priority-condition-browser-results/source-identity.txt"
          test "$(git -C candidate rev-parse HEAD)" = f0005bb4a7fe7b8674f4dfe1f319228ac4de1089
          test "$(git -C candidate rev-parse HEAD^{tree})" = b4cddb88a6137855d0b0a03a579b0f2106f24592
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          test "$(git -C validation rev-parse HEAD)" = '${{ github.event.pull_request.head.sha }}'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated application and pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r candidate/requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Run synthetic condition browser acceptance once
        shell: bash
        env:
          DKSS_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/priority-condition-browser-results/browser
        run: |
          set -euo pipefail
          chromium=$("$RUNNER_TEMP/browser-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$chromium"
          bash "$GITHUB_WORKSPACE/validation/tests/priority_condition_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --chromium "$chromium" \
            2>&1 | tee "$RUNNER_TEMP/priority-condition-browser-results/browser.log"
      - name: Save synthetic browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: priority-condition-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/priority-condition-browser-results/
          if-no-files-found: warn
          retention-days: 14
