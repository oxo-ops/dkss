name: History Presentation Browser Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'static/css/vehicle_karte_history.css'
      - 'static/css/style.css'
      - 'static/css/responsive_layout.css'
      - 'static/js/vehicle_karte_layout.js'
      - 'templates/vehicle_karte_history.html'
      - 'tests/history_presentation_browser/**'
      - '.github/workflows/history-presentation-browser.yml'

permissions:
  contents: read

concurrency:
  group: history-presentation-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out pre-category historical baseline
        uses: actions/checkout@v7
        with:
          ref: 008ed6e41352a852828f10193972e6e415f9a20e
          path: historical
          persist-credentials: false
          fetch-depth: 1
      - name: Check out pinned pre-fix release
        uses: actions/checkout@v7
        with:
          ref: 8ee31738b68b486a86ef9c48f67a0182b5a9f376
          path: baseline
          persist-credentials: false
          fetch-depth: 1
      - name: Check out exact PR candidate and validation harness
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated application and pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r candidate/requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Compare pinned baseline and exact candidate using synthetic history
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          results="$RUNNER_TEMP/history-presentation-browser-results"
          mkdir -p "$results"
          test "$(git -C baseline rev-parse HEAD)" = 8ee31738b68b486a86ef9c48f67a0182b5a9f376
          test "$(git -C baseline rev-parse HEAD^{tree})" = b16a1fd2b0e5f6da25f693e6a24a8c98f0dc79ba
          test "$(git -C candidate rev-parse HEAD)" = "$EXPECTED_HEAD"
          for source in historical baseline candidate; do
            test -z "$(git -C "$source" status --porcelain --untracked-files=all)"
            printf '%s_head=%s\n%s_tree=%s\n' "$source" "$(git -C "$source" rev-parse HEAD)" "$source" "$(git -C "$source" rev-parse HEAD^{tree})" >> "$results/source-identity.txt"
          done
          # The fix must not change recovery/bootstrap files or the application data layer.
          for file in .github/workflows/bootstrap-postgres.yml dkss_app/database.py tests/bootstrap_postgres_checks.py tests/test_bootstrap_postgres.py app.py dkss_app/__init__.py; do
            cmp "baseline/$file" "candidate/$file"
          done
          diff -qr baseline/dkss_app candidate/dkss_app
          chromium=$("$RUNNER_TEMP/browser-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$chromium"
          DKSS_BROWSER_ARTIFACT_DIR="$results/historical" \
            bash "$GITHUB_WORKSPACE/candidate/tests/history_presentation_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/historical" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --historical-height-only --expected-sha 008ed6e41352a852828f10193972e6e415f9a20e --chromium "$chromium" \
            2>&1 | tee "$results/historical.log"
          DKSS_BROWSER_ARTIFACT_DIR="$results/baseline" \
            bash "$GITHUB_WORKSPACE/candidate/tests/history_presentation_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/baseline" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --baseline-collapse --chromium "$chromium" \
            2>&1 | tee "$results/baseline.log"
          DKSS_BROWSER_ARTIFACT_DIR="$results/candidate" \
            bash "$GITHUB_WORKSPACE/candidate/tests/history_presentation_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --expected-sha "$EXPECTED_HEAD" --chromium "$chromium" \
            2>&1 | tee "$results/candidate.log"
      - name: Summarize synthetic viewport measurements
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'history-presentation-browser-results'
          for source in ('historical','baseline','candidate'):
              report=root/source/'browser-result.json'
              if not report.exists():
                  continue
              screenshot=root/source/'observed-viewport.jpg'
              if screenshot.exists():
                  print('SCREENSHOT_JPEG_BASE64:'+source+':'+base64.b64encode(screenshot.read_bytes()).decode())
              data=json.loads(report.read_text())
              print(source, data['candidate_sha'], data['candidate_tree'], data['status'])
              for row in data['short_viewports']:
                  print(source, row['width'], row['height'], row['density'], 'visible_height', row['clientHeight'], 'row_height', row['row']['height'], 'readable', row['readable'])
          PY
      - name: Save synthetic browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: history-presentation-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/history-presentation-browser-results/
          if-no-files-found: warn
          retention-days: 14
