name: Q10 Isolated Acceptance

on:
  pull_request:
    paths:
      - 'tests/q10_*'
      - 'tests/test_q10_*'
      - '.github/workflows/q10-acceptance.yml'
      - 'dkss_app/**'
      - 'driving_report_*.py'
      - 'templates/**'
      - 'static/js/**'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q10_ci
          POSTGRES_USER: q10
          POSTGRES_PASSWORD: q10-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U q10 -d dkss_q10_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: .:tests
      Q10_POSTGRES_TEST_URL: postgresql+psycopg2://q10:q10-disposable-ci-only@127.0.0.1:5432/dkss_q10_ci
      Q10_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Mark only the disposable service database
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['Q10_POSTGRES_TEST_URL'])
          with engine.begin() as c:
              c.execute(text("COMMENT ON DATABASE dkss_q10_ci IS 'Q10_SYNTHETIC_ONLY'"))
          PY
      - name: Verify PostgreSQL business invariants without expected failures
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v test_q10_acceptance_guards test_q10_postgres_acceptance 2>&1 | tee q10-postgres.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q10-postgres-results
          path: q10-postgres.log

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q10_ci
          POSTGRES_USER: q10
          POSTGRES_PASSWORD: q10-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U q10 -d dkss_q10_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: .:tests
      Q10_POSTGRES_TEST_URL: postgresql+psycopg2://q10:q10-disposable-ci-only@127.0.0.1:5432/dkss_q10_ci
      Q10_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/q10-node" playwright@1.62.1
          "$RUNNER_TEMP/q10-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser flows against a marked, synthetic PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['Q10_POSTGRES_TEST_URL'])
          with engine.begin() as c:
              c.execute(text("COMMENT ON DATABASE dkss_q10_ci IS 'Q10_SYNTHETIC_ONLY'"))
          PY
          ready="$RUNNER_TEMP/q10-browser.json"
          python tests/q10_browser_server.py "$ready" > q10-browser-server.log 2>&1 &
          server=$!
          trap 'touch "$RUNNER_TEMP/q10-browser.stop"; wait "$server" || true' EXIT
          for attempt in $(seq 1 60); do
            test -f "$ready" && break
            kill -0 "$server"
            sleep 1
          done
          test -f "$ready"
          NODE_PATH="$RUNNER_TEMP/q10-node/node_modules" node tests/q10_browser_acceptance.cjs "$ready" q10-browser-results | tee q10-browser.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q10-browser-results
          path: |
            q10-browser-results/
            q10-browser.log
            q10-browser-server.log
