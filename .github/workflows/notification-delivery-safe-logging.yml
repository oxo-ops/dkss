name: Notification Delivery Safe Logging

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'dkss_app/auth.py'
      - 'dkss_app/notifications_delivery.py'
      - 'dkss_app/delivery_failure_logging.py'
      - 'tests/test_notification_delivery_safe_logging.py'
      - '.github/workflows/notification-delivery-safe-logging.yml'

permissions:
  contents: read

concurrency:
  group: notification-delivery-safe-logging-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  isolated-delivery-contract:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install candidate dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify exact source and run mocked notification tests once
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'tested_head=%s\ntested_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          python_bin=$(command -v python)
          mkdir -p "$RUNNER_TEMP/delivery-test-home"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/delivery-test-home" LANG=C.UTF-8 \
            AWS_EC2_METADATA_DISABLED=true AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            AWS_CONFIG_FILE=/dev/null S3_BUCKET_NAME='' OPENAI_API_KEY='' SMTP_HOST='' \
            VAPID_PRIVATE_KEY='' VAPID_PUBLIC_KEY='' DATABASE_URL='' RENDER='' \
            PYTHONDONTWRITEBYTECODE=1 "$python_bin" -B - <<'PY'
          import json
          import socket
          import sys
          import unittest
          from unittest.mock import patch

          blocked = []
          def reject_io(event, _args):
              if event in {'socket.connect', 'socket.bind', 'sqlite3.connect'}:
                  blocked.append(event)
                  raise RuntimeError('DELIVERY_TEST_NETWORK_AND_DATABASE_IO_FORBIDDEN')
          sys.addaudithook(reject_io)

          from sqlalchemy.engine import Engine
          # Avoid urllib3's import-time IPv6 capability bind in this mocked
          # fixture; network, bind and database guards remain fully active.
          with patch.object(socket, 'has_ipv6', False), patch.object(Engine, 'connect', side_effect=RuntimeError('DELIVERY_TEST_DATABASE_FORBIDDEN')) as connect:
              suite = unittest.TestLoader().discover('tests', pattern='test_notification_delivery_safe_logging.py')
              result = unittest.TextTestRunner(verbosity=2).run(suite)
              valid = result.wasSuccessful() and result.testsRun == 27 and not result.skipped and not blocked and not connect.called
              print(json.dumps({'status': 'PASS' if valid else 'FAIL', 'tests_run': result.testsRun,
                  'skipped': len(result.skipped), 'failures': len(result.failures), 'errors': len(result.errors),
                  'blocked_io_attempts': len(blocked), 'database_connect_attempts': connect.call_count,
                  'all_transports_mocked': True, 'production_accessed': False, 'automatic_retry': False}))
              raise SystemExit(0 if valid else 1)
          PY
