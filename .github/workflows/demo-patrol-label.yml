name: Demo Patrol Label Display
on:
  pull_request:
    paths:
      - 'dkss_app/demo_label_display.py'
      - 'dkss_app/checklist_common.py'
      - 'dkss_app/checklists.py'
      - 'templates/checklist_result_detail.html'
      - 'templates/pointouts.html'
      - 'templates/pointout_detail.html'
      - 'tests/test_demo_label_display.py'
      - '.github/workflows/demo-patrol-label.yml'
permissions:
  contents: read
jobs:
  display:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Flask==3.1.2
      - run: python -m unittest discover -s tests -p test_demo_label_display.py -v
