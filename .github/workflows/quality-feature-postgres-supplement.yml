name: Quality Feature PostgreSQL Supplement

# This workflow only validates the frozen draft-PR candidate below.
# Do not retarget it to a live database or silently advance the checkout ref.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/quality-feature-postgres-supplement.yml'

permissions:
  contents: read

concurrency:
  group: quality-feature-postgres-supplement-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  supplemental:
    if: >-
      github.repository == 'oxo-ops/dkss' &&
      github.event.pull_request.number == 361 &&
      github.event.pull_request.head.repo.full_name == 'oxo-ops/dkss' &&
      github.event.pull_request.head.ref == 'verify/quality-feature-20261110'
    name: Supplemental / ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: driving-readership
            database: dkss_q08_ci
            user: q08
            password: q08-disposable-ci-only
            q08_url: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q08_ci
            q03_url: ''
            browser: false
            expected_tests: 55
            tests: >-
              test_driving_verified_readership.PostgresVerifiedReadershipTests
              test_driving_reader_generation.PostgresReaderGenerationTests
              test_driving_pending_identity_recovery.PostgresPendingRecoveryTests
          - group: checklist-event-storage
            database: dkss_q08_ci
            user: q02
            password: q02-disposable-ci-only
            q08_url: postgresql+psycopg2://q02:q02-disposable-ci-only@127.0.0.1:5432/dkss_q08_ci
            q03_url: ''
            browser: false
            expected_tests: 7
            tests: >-
              test_q02_postgres_checklist_event_storage.PostgresChecklistStorageTests
              test_q02_postgres_checklist_event_storage.PostgresChecklistDailyFlowTests
          - group: patrol-person-selection
            database: dkss_q03_test
            user: q03_test
            password: q03-disposable-ci-only
            q08_url: ''
            q03_url: postgresql+psycopg2://q03_test:q03-disposable-ci-only@127.0.0.1:5432/dkss_q03_test
            browser: false
            expected_tests: 36
            tests: test_q03_patrol_selection.PostgresPatrolSelectionTests
          - group: patrol-null-edit-browser
            database: dkss_q08_patrol_ci
            user: q08
            password: q08-disposable-ci-only
            q08_url: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q08_patrol_ci
            q03_url: ''
            browser: true
            expected_tests: 9
            tests: >-
              test_q08_patrol_null_edit.PostgresPatrolNullEditTests
              test_q08_patrol_null_edit.PatrolNullBrowserTests
              test_q08_patrol_null_edit.PostgresPatrolNullBrowserTests
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: ${{ matrix.database }}
          POSTGRES_USER: ${{ matrix.user }}
          POSTGRES_PASSWORD: ${{ matrix.password }}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ${{ matrix.user }} -d ${{ matrix.database }}"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      EXPECTED_COMMIT: 3ca0f38e36f47ad94a625e71492bedbdd2f11841
      EXPECTED_TREE: cc05950a0ef99241ac1a80b320ddcafd0944c710
      PYTHONPATH: .:tests
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      FLASK_SKIP_DOTENV: '1'
      DATABASE_URL: 'sqlite:///:memory:'
      SECRET_KEY: synthetic-supplemental-acceptance-only
      RENDER: ''
      RATELIMIT_STORAGE_URI: 'memory://'
      Q08_POSTGRES_TEST_URL: ${{ matrix.q08_url }}
      Q03_POSTGRES_TEST_URL: ${{ matrix.q03_url }}
      Q08_PATROL_BROWSER: ${{ matrix.browser && '1' || '' }}
      DKSS_TEST_NAMES: ${{ matrix.tests }}
      DKSS_EXPECTED_TESTS: ${{ matrix.expected_tests }}
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3ca0f38e36f47ad94a625e71492bedbdd2f11841
          persist-credentials: false
      - name: Assert frozen application commit and tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p supplemental-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD > supplemental-evidence/application-commit.txt
          git rev-parse 'HEAD^{tree}' > supplemental-evidence/application-tree.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v7
        if: matrix.browser
        with:
          node-version: '22'
      - name: Install declared application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install pinned native Chromium runtime
        if: matrix.browser
        shell: bash
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/q08-node" playwright@1.62.1
          "$RUNNER_TEMP/q08-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Execute only the uncovered acceptance cases
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/q08-node/node_modules"
          python - <<'PY' 2>&1 | tee supplemental-evidence/tests.log
          import json
          import os
          from pathlib import Path
          import sys
          import unittest

          names = os.environ['DKSS_TEST_NAMES'].split()
          expected = int(os.environ['DKSS_EXPECTED_TESTS'])
          loader = unittest.TestLoader()
          suite = loader.loadTestsFromNames(names)
          discovered = suite.countTestCases()
          evidence = Path('supplemental-evidence')
          plan = {'application_commit': os.environ['EXPECTED_COMMIT'],
                  'application_tree': os.environ['EXPECTED_TREE'],
                  'selected_classes': names, 'expected_tests': expected,
                  'discovered_tests': discovered, 'loader_errors': len(loader.errors)}
          (evidence / 'plan.json').write_text(json.dumps(plan, indent=2) + '\n')
          if loader.errors or discovered != expected:
              raise SystemExit('Acceptance discovery differs from the frozen plan')

          class EvidenceResult(unittest.TextTestResult):
              def __init__(self, *args, **kwargs):
                  super().__init__(*args, **kwargs)
                  self.success_ids = []
              def addSuccess(self, test):
                  super().addSuccess(test)
                  self.success_ids.append(test.id())

          result = unittest.TextTestRunner(verbosity=2, resultclass=EvidenceResult).run(suite)
          # setUpClass skips do not increment testsRun. Count actual successes,
          # and fail acceptance on any skip rather than subtracting skip records.
          summary = dict(plan, tests_run=result.testsRun,
                         successful_tests=len(result.success_ids),
                         successful_test_ids=result.success_ids,
                         skip_records=len(result.skipped),
                         skipped=[{'test': test.id(), 'reason': reason}
                                  for test, reason in result.skipped],
                         failures=len(result.failures), errors=len(result.errors),
                         expected_failures=len(result.expectedFailures),
                         unexpected_successes=len(result.unexpectedSuccesses))
          summary['accepted'] = (result.wasSuccessful() and not result.skipped
                                 and not result.expectedFailures
                                 and result.testsRun == expected
                                 and len(result.success_ids) == expected)
          (evidence / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print('SUPPLEMENTAL_ACCEPTANCE', json.dumps({k: v for k, v in summary.items()
                if k not in {'successful_test_ids', 'skipped'}}), flush=True)
          sys.exit(0 if summary['accepted'] else 1)
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: supplemental-${{ matrix.group }}-3ca0f38e-${{ github.run_id }}
          path: supplemental-evidence/
          if-no-files-found: warn
          retention-days: 14
