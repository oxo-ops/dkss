name: Q05 Usage Summary Transactions

on:
  pull_request:
    paths:
      - 'dkss_app/audit.py'
      - 'dkss_app/auth.py'
      - 'dkss_app/dashboard.py'
      - 'tests/test_usage_summary*.py'
      - '.github/workflows/q05-usage-summary.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usage-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q05_ci
          POSTGRES_USER: q05
          POSTGRES_PASSWORD: q05-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q05 -d dkss_q05_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .:tests
      Q05_USAGE_POSTGRES_URL: postgresql+psycopg2://q05:q05-disposable-ci-only@127.0.0.1:5432/dkss_q05_ci
      Q05_USAGE_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify creation, contention, audit atomicity and retries
        shell: bash
        run: |
          set -o pipefail
          python -m unittest test_usage_summary test_usage_summary_postgres -v 2>&1 | tee q05-usage-results.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q05-usage-results
          path: q05-usage-results.log
