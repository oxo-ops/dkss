name: Demo cross browser isolated acceptance
on:
  pull_request:
    paths: ['dkss_app/public_demo.py', 'templates/base.html', 'static/js/public_demo_share.js', 'tests/test_demo_share_entry.py', 'tests/demo_share_browser/**', '.github/workflows/demo-share-browser.yml']
permissions:
  contents: read
jobs:
  synthetic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Isolated browser dependencies
        run: |
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Verify exact candidate and real two-context cookies
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          PY="$RUNNER_TEMP/browser-venv/bin/python"
          CHROMIUM=$("$PY" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          bash tests/demo_share_browser/run.sh "$GITHUB_WORKSPACE" "$PY" unit
          bash tests/demo_share_browser/run.sh "$GITHUB_WORKSPACE" "$PY" browser --artifacts "$RUNNER_TEMP/demo-share-output" --expected-sha "$EXPECTED_HEAD" --chromium "$CHROMIUM"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-share-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/demo-share-output/
          retention-days: 7
