name: Plan deferred annual table regression
on:
  push:
    branches: [review/plan-year-lazy-20261119]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/pw" playwright@1.62.0
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/pw/node_modules/playwright"
          CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          bash tests/plan_front_probe/run.sh "$PWD" "$(which python)" "$RUNNER_TEMP/out" "$CHROME"
          git rev-parse HEAD > "$RUNNER_TEMP/out/head.txt"
        env:
          PLAN_REPO: ${{ github.workspace }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan-front-probe
          path: ${{ runner.temp }}/out
