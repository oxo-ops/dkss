name: Demo reflection rollover acceptance
on:
  push:
    branches: [review/demo-reflection-rollover-20261119, review/priority-ui-267-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Exact checkout and isolated tests
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" PYTHONPATH=.:tests python -m unittest test_demo_reflection_saved_period test_driving_reflection_identity
          node tests/driving_report_reflection_js.cjs
