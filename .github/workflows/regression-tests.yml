name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      demo-redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PUBLIC_DEMO_TEST_REDIS_URL: "redis://127.0.0.1:6379/15"
      PUBLIC_DEMO_TEST_REDIS_OWNED: "1"
      PUBLIC_DEMO_REQUIRE_REDIS: "1"
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
      SMTP_HOST: ""
      S3_BUCKET_NAME: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'tested_head=%s\ntested_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -v
      - name: Check durable import browser controller
        run: node --test tests/document_import_queue_js.cjs
      - name: Check driving trend data and missing measurements
        run: node --test tests/driving_report_insights_js.cjs tests/driving_report_periods_js.cjs tests/driving_report_navigation_js.cjs tests/driving_report_reflection_js.cjs
      - name: Check shared vehicle-choice labels
        run: node --test tests/vehicle_karte_selector_js.cjs
      - name: Check shared responsive viewport behavior
        run: node tests/responsive_layout_js.cjs
      - name: Check invoice summary display and source selection
        run: node --test tests/invoice_summary_ui_js.cjs
      - name: Inspect architecture without starting the app
        run: python tools/architecture_inventory.py > architecture-inventory.json
      - name: Verify generated schema documentation
        run: |
          python tools/generate_schema_docs.py /tmp/database_schema.md
          diff -u docs/database_schema.md /tmp/database_schema.md
      - name: Save inventory
        uses: actions/upload-artifact@v7
        with:
          name: architecture-inventory
          path: architecture-inventory.json
