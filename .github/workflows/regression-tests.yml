name: Combined Regression Budget Verification

on:
  push:
    branches: [verify/combined-regression-budget-20261110]

permissions:
  contents: read

concurrency:
  group: combined-regression-budget-20261110
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-latest
    # Old run 42787106378 completed its test steps at the 15-minute boundary.
    # Keep the candidate fixed and provide room for setup and final cleanup.
    timeout-minutes: 30
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
      SMTP_HOST: ""
      S3_BUCKET_NAME: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 6fc8b277cd5229cf8e28b762fc7a18df4b0764f4
          persist-credentials: false
      - name: Record exact tested source
        shell: bash
        env:
          EXPECTED_HEAD: 6fc8b277cd5229cf8e28b762fc7a18df4b0764f4
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "b16a1fd2b0e5f6da25f693e6a24a8c98f0dc79ba"
          test -z "$(git status --porcelain --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/combined-regression-evidence"
          printf 'tested_head=%s\ntested_tree=%s\nworkflow_sha=%s\nprior_run=42787106378\njob_timeout_minutes=30\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})" "$GITHUB_SHA" | tee "$RUNNER_TEMP/combined-regression-evidence/source-identity.txt"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/combined-regression-evidence/python-regression.log"
      - name: Check durable import browser controller
        run: node --test tests/document_import_queue_js.cjs
      - name: Check driving trend data and missing measurements
        run: node --test tests/driving_report_insights_js.cjs tests/driving_report_periods_js.cjs tests/driving_report_navigation_js.cjs tests/driving_report_reflection_js.cjs
      - name: Check shared vehicle-choice labels
        run: node --test tests/vehicle_karte_selector_js.cjs
      - name: Check shared responsive viewport behavior
        run: node tests/responsive_layout_js.cjs
      - name: Check invoice summary display and source selection
        run: node --test tests/invoice_summary_ui_js.cjs
      - name: Inspect architecture without starting the app
        run: python tools/architecture_inventory.py > architecture-inventory.json
      - name: Verify generated schema documentation
        run: |
          python tools/generate_schema_docs.py /tmp/database_schema.md
          diff -u docs/database_schema.md /tmp/database_schema.md
      - name: Save inventory
        uses: actions/upload-artifact@v7
        with:
          name: architecture-inventory
          path: architecture-inventory.json
      - name: Save fixed-candidate regression evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: combined-regression-budget-evidence
          path: ${{ runner.temp }}/combined-regression-evidence
          if-no-files-found: error
          retention-days: 30
