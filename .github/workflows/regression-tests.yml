name: Regression Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      OPENAI_API_KEY: ""
      SMTP_HOST: ""
      S3_BUCKET_NAME: ""
      VAPID_PRIVATE_KEY: ""
      VAPID_PUBLIC_KEY: ""
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated regression tests
        run: python -m unittest discover -s tests -v
      - name: Check durable import browser controller
        run: node --test tests/document_import_queue_js.cjs
      - name: Check driving trend data and missing measurements
        run: node --test tests/driving_report_insights_js.cjs
      - name: Check shared responsive viewport behavior
        run: node tests/responsive_layout_js.cjs
      - name: Inspect architecture without starting the app
        run: python tools/architecture_inventory.py > architecture-inventory.json
      - name: Save inventory
        uses: actions/upload-artifact@v7
        with:
          name: architecture-inventory
          path: architecture-inventory.json
