name: Q04 PostgreSQL Master Concurrency

on:
  push:
    branches:
      - 'test/q04-master-concurrency-*'
      - 'fix/q04-master-concurrency-*'
      - 'fix/q04-master-integrity-*'
      - 'fix/q04-news-office-*'
      - 'feat/q04-master-preflight-*'
      - 'test/q04-master-upgrade-*'
      - 'test/q04-related-writes-*'
      - 'test/q04-master-order-*'
      - 'test/q04-news-office-*'
  pull_request:
    paths:
      - 'tests/test_q04_postgres_master_concurrency.py'
      - 'tests/test_q04_master_uniqueness.py'
      - 'tests/test_q04_postgres_master_upgrade.py'
      - 'tests/test_q04_postgres_master_index_acceptance.py'
      - 'tests/test_q04_master_preflight.py'
      - 'tests/test_q04_postgres_master_preflight.py'
      - 'tools/q04_master_preflight.py'
      - 'tests/test_q04_postgres_related_writes.py'
      - 'tests/test_q04_postgres_master_order.py'
      - 'tests/test_q04_postgres_news_office.py'
      - 'tests/test_q04_postgres_news_resilience.py'
      - 'tests/test_q04_postgres_delivery_integrity.py'
      - 'tests/test_q04_postgres_history_master_links.py'
      - 'tests/test_q04_postgres_checklist_office_links.py'
      - 'tests/test_q04_postgres_named_master_gaps.py'
      - 'tests/test_q04_postgres_driver_license_links.py'
      - 'tests/test_q04_postgres_master_reuse_and_reverse.py'
      - 'tests/test_q04_postgres_vehicle_batch_master_links.py'
      - 'tests/q04_pg_helpers.py'
      - 'tests/fixtures/application_contract.json'
      - '.github/workflows/q04-postgres-masters.yml'
      - 'dkss_app/masters.py'
      - 'dkss_app/news.py'
      - 'dkss_app/notifications_delivery.py'
      - 'dkss_app/vehicle_master.py'
      - 'dkss_app/master_readers.py'
      - 'dkss_app/models.py'
      - 'dkss_app/database.py'
      - 'dkss_app/__init__.py'
      - 'dkss_app/routes.py'
      - 'dkss_app/access.py'
      - 'dkss_app/auth.py'
      - 'dkss_app/safety.py'
      - 'dkss_app/checklists.py'
      - 'requirements.txt'

permissions:
  contents: read

jobs:
  postgres-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q04_ci
          POSTGRES_USER: q04
          POSTGRES_PASSWORD: q04-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q04 -d dkss_q04_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      Q04_POSTGRES_TEST_URL: postgresql+psycopg2://q04:q04-disposable-ci-only@127.0.0.1:5432/dkss_q04_ci
      Q04_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify master regressions on disposable SQLite
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_master_*.py' -v 2>&1 | tee q04-sqlite-results.log
          python -m unittest discover -s tests -p 'test_application_foundation.py' -v 2>&1 | tee -a q04-sqlite-results.log
      - name: Confirm the concurrency checks still detect the original failures
        shell: bash
        env:
          Q04_BASELINE_REF: b5321c60914cce301ac80672af51572b187fbe03
        run: |
          git fetch --no-tags --depth=1 origin "$Q04_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/q04-master-baseline" "$Q04_BASELINE_REF"
          cp tests/test_q04_postgres_master_concurrency.py "$RUNNER_TEMP/q04-master-baseline/tests/"
          set +e
          (cd "$RUNNER_TEMP/q04-master-baseline" && python -m unittest discover -s tests -p 'test_q04_postgres_master_concurrency.py' -v) > q04-baseline-results.log 2>&1
          baseline_exit=$?
          set -e
          python - "$baseline_exit" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('q04-baseline-results.log').read_text()
          assert sys.argv[1] == '1', 'Baseline must fail integrity assertions'
          assert re.search(r'Ran 16 tests\b', log), 'All baseline checks must execute'
          assert 'FAILED (failures=13)' in log, 'Baseline failure count changed; inspect evidence'
          assert log.count('Q04_EVIDENCE:') == 14, 'All parallel schedules must execute'
          print('BASELINE_CONFIRMED: 16 tests, 13 expected integrity failures')
          PY
      - name: Verify master races on disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_master_concurrency.py' -v 2>&1 | tee q04-postgres-results.log
      - name: Verify legacy master upgrades on disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_master_upgrade.py' -v 2>&1 | tee q04-postgres-upgrade-results.log
      - name: Confirm the related-write checks detect the original twelve failures
        shell: bash
        env:
          Q04_RELATED_BASELINE_REF: 7fc48cf6ae17d023d89b3cc2cb425c3139dea829
        run: |
          git fetch --no-tags --depth=1 origin "$Q04_RELATED_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/q04-related-baseline" "$Q04_RELATED_BASELINE_REF"
          cp tests/test_q04_postgres_related_writes.py "$RUNNER_TEMP/q04-related-baseline/tests/"
          set +e
          (cd "$RUNNER_TEMP/q04-related-baseline" && python -m unittest discover -s tests -p 'test_q04_postgres_related_writes.py' -v) > q04-related-baseline-results.log 2>&1
          baseline_exit=$?
          set -e
          python - "$baseline_exit" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('q04-related-baseline-results.log').read_text()
          assert sys.argv[1] == '1', 'Related-write baseline must fail integrity assertions'
          assert re.search(r'Ran 16 tests\b', log), 'All related-write checks must execute'
          assert 'FAILED (failures=12)' in log, 'Inspect unexpected baseline failures'
          assert log.count('Q04_RELATED_CONTROL:') == 4, 'All ordinary saves must execute'
          assert log.count('Q04_RELATED_EVIDENCE:') == 12, 'All parallel schedules must execute'
          print('RELATED_BASELINE_CONFIRMED: 4 ordinary saves pass; 12 races fail')
          PY
      - name: Verify related writes racing master mutations on disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_related_writes.py' -v 2>&1 | tee q04-postgres-related-results.log
      - name: Verify shared order conflicts and retries on disposable PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_master_order.py' -v 2>&1 | tee q04-postgres-order-results.log
      - name: Confirm new master checks detect the unfixed main snapshot
        shell: bash
        env:
          Q04_GAPS_BASELINE_REF: 6d7d8c9ccc7bd661cd86a6b5fa68b99da2a7c668
        run: |
          git fetch --no-tags --depth=1 origin "$Q04_GAPS_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/q04-gaps-baseline" "$Q04_GAPS_BASELINE_REF"
          cp tests/q04_pg_helpers.py "$RUNNER_TEMP/q04-gaps-baseline/tests/"
          for name in delivery_integrity history_master_links checklist_office_links named_master_gaps driver_license_links master_reuse_and_reverse vehicle_batch_master_links; do
            cp "tests/test_q04_postgres_${name}.py" "$RUNNER_TEMP/q04-gaps-baseline/tests/"
          done
          set +e
          (cd "$RUNNER_TEMP/q04-gaps-baseline" && PYTHONPATH=tests python -m unittest test_q04_postgres_delivery_integrity test_q04_postgres_history_master_links test_q04_postgres_checklist_office_links test_q04_postgres_named_master_gaps test_q04_postgres_driver_license_links test_q04_postgres_master_reuse_and_reverse test_q04_postgres_vehicle_batch_master_links -v) > q04-gaps-baseline-results.log 2>&1
          baseline_exit=$?
          set -e
          python - "$baseline_exit" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('q04-gaps-baseline-results.log').read_text()
          assert sys.argv[1] == '1', 'Unfixed snapshot must fail integrity assertions'
          assert re.search(r'Ran 130 tests\b', log), 'All new checks must execute'
          assert 'FAILED (failures=94)' in log, 'Inspect changed baseline evidence'
          print('GAPS_BASELINE_CONFIRMED: 130 tests, 94 integrity failures')
          PY
      - name: Verify uncovered master and historical-reference paths on PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          for name in delivery_integrity history_master_links checklist_office_links named_master_gaps driver_license_links master_reuse_and_reverse vehicle_batch_master_links; do
            python -m unittest discover -s tests -p "test_q04_postgres_${name}.py" -v || exit $?
          done 2>&1 | tee q04-postgres-gaps-results.log
      - name: Verify Q03 person locks against office and vehicle mutations
        run: PYTHONPATH=.:tests python -m unittest test_q03_master_lock_order -v
      - name: Confirm office news checks detect the unfixed main
        shell: bash
        env:
          Q04_NEWS_BASELINE_REF: bb3a1183c8cb9511e9e883351f5df2351f114197
        run: |
          git fetch --no-tags origin "$Q04_NEWS_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/q04-news-baseline" "$Q04_NEWS_BASELINE_REF"
          cp tests/test_q04_postgres_news_office.py "$RUNNER_TEMP/q04-news-baseline/tests/"
          set +e
          (cd "$RUNNER_TEMP/q04-news-baseline" && python -m unittest discover -s tests -p 'test_q04_postgres_news_office.py' -v) > q04-news-baseline-results.log 2>&1
          baseline_exit=$?
          set -e
          python - "$baseline_exit" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('q04-news-baseline-results.log').read_text()
          assert sys.argv[1] == '1', 'Unfixed main must fail integrity assertions'
          assert re.search(r'Ran 6 tests\b', log), 'All six original scenarios must execute'
          assert 'FAILED (failures=4)' in log, 'Inspect changed baseline evidence'
          assert log.count('Q04_NEWS_CONTROL:') == 2, 'Both ordinary saves must pass'
          print('NEWS_BASELINE_CONFIRMED: 6 tests, 4 integrity failures')
          PY
      - name: Verify office-targeted news racing office mutations
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_news*.py' -v 2>&1 | tee q04-postgres-news-results.log
      - name: Confirm existing index checks detect the unfixed main
        shell: bash
        env:
          Q04_INDEX_BASELINE_REF: 25972cde39eba1454d9e3392d870af51872a07a7
        run: |
          git fetch --no-tags origin "$Q04_INDEX_BASELINE_REF"
          git worktree add --detach "$RUNNER_TEMP/q04-index-baseline" "$Q04_INDEX_BASELINE_REF"
          cp tests/test_q04_postgres_master_index_acceptance.py "$RUNNER_TEMP/q04-index-baseline/tests/"
          set +e
          (cd "$RUNNER_TEMP/q04-index-baseline" && PYTHONPATH=tests python -m unittest test_q04_postgres_master_index_acceptance -v) > q04-index-baseline-results.log 2>&1
          baseline_exit=$?
          set -e
          python - "$baseline_exit" <<'PY'
          import pathlib, re, sys
          log = pathlib.Path('q04-index-baseline-results.log').read_text()
          assert sys.argv[1] == '1', 'Unfixed main must fail index integrity assertions'
          assert re.search(r'Ran 16 tests\b', log), 'All index acceptance checks must execute'
          assert 'FAILED (failures=16)' in log, 'Inspect changed baseline evidence'
          print('INDEX_BASELINE_CONFIRMED: 16 tests, 16 integrity failures')
          PY
      - name: Verify existing master index definitions and validity on PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p 'test_q04_postgres_master_index_acceptance.py' -v 2>&1 | tee q04-postgres-index-results.log
      - name: Verify read-only master preflight on PostgreSQL
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=.:tests python -m unittest test_q04_postgres_master_preflight -v 2>&1 | tee q04-master-preflight-results.log
      - name: Keep concurrency evidence even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: q04-postgres-master-evidence
          path: |
            q04-sqlite-results.log
            q04-baseline-results.log
            q04-postgres-results.log
            q04-postgres-upgrade-results.log
            q04-postgres-related-results.log
            q04-related-baseline-results.log
            q04-postgres-order-results.log
            q04-postgres-gaps-results.log
            q04-gaps-baseline-results.log
            q04-postgres-news-results.log
            q04-news-baseline-results.log
            q04-index-baseline-results.log
            q04-postgres-index-results.log
            q04-master-preflight-results.log
          if-no-files-found: warn
          retention-days: 7
