name: Personal saved analysis rollover
on:
  push:
    branches: [validation/personal-analysis-rollover-20261119, 'validation/header-guide-followup-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify account, role, period and source isolation
        run: python -m unittest discover -s tests -p test_demo_reflection_saved_period.py -v
