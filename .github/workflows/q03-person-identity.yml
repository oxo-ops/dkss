name: Q03 PostgreSQL Person Identity

on:
  pull_request:
    paths:
      - 'dkss_app/safety_identity.py'
      - 'dkss_app/safety_permissions.py'
      - 'dkss_app/checklists.py'
      - 'dkss_app/checklist_common.py'
      - 'dkss_app/safety.py'
      - 'dkss_app/models.py'
      - 'dkss_app/database.py'
      - 'tests/test_q03*.py'
      - '.github/workflows/q03-person-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q03_test
          POSTGRES_USER: q03_test
          POSTGRES_PASSWORD: q03-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q03_test -d dkss_q03_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      Q03_POSTGRES_TEST_URL: postgresql+psycopg2://q03_test:q03-disposable-ci-only@127.0.0.1:5432/dkss_q03_test
      AWS_EC2_METADATA_DISABLED: 'true'
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      PYTHONPATH: tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest test_q03_postgres_person_identity.Q03PostgresPersonIdentityTests test_q03_account_generations.CombinedPostgresIdentityTests test_q03_vehicle_identity.Q03PostgresVehicleIdentityTests test_q03_form_generation.PostgresFormGenerationTests test_q03_actor_generation.PostgresActorGenerationTests -v
