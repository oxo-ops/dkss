name: Guarded Rollback Independent Validation

# The dedicated validation branch starts only this new acceptance workflow.
# Opening a PR separately may start the repository's existing full suite.
on:
  push:
    branches: ['validation/guarded-rollback-independent-20261112']
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full reviewed guarded-candidate commit SHA
        required: true
        type: string
permissions:
  contents: read
jobs:
  independent-retention:
    if: github.repository == 'oxo-ops/dkss'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q08_ci
          POSTGRES_USER: q08
          POSTGRES_PASSWORD: q08-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --log-driver none
          --health-cmd "pg_isready -U q08 -d dkss_q08_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha || github.sha }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'
      FLASK_SKIP_DOTENV: '1'
      DATABASE_URL: 'sqlite:///:memory:'
      Q08_POSTGRES_TEST_URL: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q08_ci
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
      RATELIMIT_STORAGE_URI: 'memory://'
      RENDER: ''
      AWS_EC2_METADATA_DISABLED: 'true'
      AWS_CONFIG_FILE: /dev/null
      AWS_SHARED_CREDENTIALS_FILE: /dev/null
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - name: Require immutable candidate
        shell: bash
        run: '[[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: 692298445d7d57c9c611328792ef966d27b4ebe9
          path: .producer-v8
          persist-credentials: false
      - name: Record exact code versions only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          test "$(git -C .producer-v8 rev-parse HEAD)" = 692298445d7d57c9c611328792ef966d27b4ebe9
          mkdir -p guarded-safe-summary
          git rev-parse HEAD > guarded-safe-summary/commit.txt
          git rev-parse 'HEAD^{tree}' > guarded-safe-summary/tree.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify disposable PostgreSQL has no output logging path
        shell: bash
        env:
          CI_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test "$(docker inspect --format '{{.HostConfig.LogConfig.Type}}' "$CI_POSTGRES_CONTAINER")" = none
          docker exec -i "$CI_POSTGRES_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U q08 -d dkss_q08_ci \
            < tests/guarded_ci_postgres_logging.sql > /dev/null 2>&1
          effective=0
          for attempt in $(seq 1 30); do
            if docker exec -i "$CI_POSTGRES_CONTAINER" psql -X -q -v ON_ERROR_STOP=1 -U q08 -d dkss_q08_ci \
                < tests/guarded_ci_postgres_logging_check.sql > /dev/null 2>&1; then
              effective=1
              break
            fi
            sleep 1
          done
          test "$effective" = 1
          test "$(docker inspect --format '{{.HostConfig.LogConfig.Type}}' "$CI_POSTGRES_CONTAINER")" = none
          echo 'GUARDED_PG_LOGGING_VERIFIED=1' >> "$GITHUB_ENV"
      - name: Require all independent boundaries and native PG cases
        shell: bash
        run: |
          set -euo pipefail
          private_root=$(mktemp -d "$RUNNER_TEMP/guarded-validation.XXXXXX")
          trap 'rm -rf "$private_root"' EXIT
          export DKSS_VALIDATION_TMP="$private_root" TMPDIR="$private_root"
          export PYTHONPATH="$GITHUB_WORKSPACE/tests/guarded_independent_guard:$GITHUB_WORKSPACE:$GITHUB_WORKSPACE/tests"
          # Child stdout/stderr and exceptions are discarded before any app import.
          # This file contains only source versions, counts, stage names and booleans.
          python tests/run_guarded_independent.py --producer .producer-v8 --postgres > guarded-safe-summary/result.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guarded-safe-summary-${{ inputs.candidate_sha || github.sha }}-${{ github.run_id }}
          path: |
            guarded-safe-summary/commit.txt
            guarded-safe-summary/tree.txt
            guarded-safe-summary/result.json
          if-no-files-found: warn
          retention-days: 14
