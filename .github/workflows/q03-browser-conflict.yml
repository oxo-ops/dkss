name: Q03 Browser Conflict Recovery
on:
  pull_request:
    paths:
      - 'dkss_app/checklists.py'
      - 'dkss_app/http.py'
      - 'static/js/base.js'
      - 'templates/base.html'
      - 'templates/checklist_result_detail.html'
      - 'templates/vehicle_checklist_results.html'
      - 'tests/q03_browser*'
      - 'tests/test_q03_conflict_responses.py'
      - '.github/workflows/q03-browser-conflict.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q10_ci
          POSTGRES_USER: q10
          POSTGRES_PASSWORD: q10-disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U q10 -d dkss_q10_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      Q03_BROWSER_CASE: pc-safety,pc-vehicle,phone-safety,phone-vehicle
      Q03_SOURCE_SHA: ${{ github.sha }}
      PYTHONPATH: .:tests
      Q10_POSTGRES_TEST_URL: postgresql+psycopg2://q10:q10-disposable-ci-only@127.0.0.1:5432/dkss_q10_ci
      Q10_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - name: Install pinned browser test runtime
        run: |
          npm install --prefix "$RUNNER_TEMP/q03-node" playwright@1.62.1
          "$RUNNER_TEMP/q03-node/node_modules/.bin/playwright" install --with-deps chromium
      - name: Run browser flows against a marked, synthetic PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ['Q10_POSTGRES_TEST_URL'])
          with engine.begin() as c:
              c.execute(text("COMMENT ON DATABASE dkss_q10_ci IS 'Q10_SYNTHETIC_ONLY'"))
          PY
          ready="$RUNNER_TEMP/q03-browser-conflict.json"
          python tests/q03_browser_server.py "$ready" > q03-browser-conflict-server.log 2>&1 &
          server=$!
          trap 'touch "$RUNNER_TEMP/q03-browser-conflict.stop"; wait "$server" || true' EXIT
          for attempt in $(seq 1 60); do
            test -f "$ready" && break
            kill -0 "$server"
            sleep 1
          done
          test -f "$ready"
          NODE_PATH="$RUNNER_TEMP/q03-node/node_modules" node tests/q03_browser_acceptance.cjs "$ready" q03-browser-conflict-results | tee q03-browser-conflict.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q03-browser-conflict-results
          path: |
            q03-browser-conflict-results/
            q03-browser-conflict.log
            q03-browser-conflict-server.log
