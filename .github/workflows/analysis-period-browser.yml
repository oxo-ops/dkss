name: Analysis period row browser
on:
  push:
    branches: [review/analysis-period-row-20261118]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  period-row:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0 jinja2==3.1.6
      - run: python -m playwright install --with-deps chromium
      - run: env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" EXPECTED_SHA="$GITHUB_SHA" ARTIFACTS="$RUNNER_TEMP/period" python tests/analysis_period_browser/acceptance.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: analysis-period-${{ github.sha }}
          path: ${{ runner.temp }}/period
