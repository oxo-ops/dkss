name: Isolated PostgreSQL Bootstrap

on:
  push:
    branches: ['verify/bootstrap-init-db-20261104']
  pull_request:
    paths:
      - 'dkss_app/database.py'
      - 'dkss_app/__init__.py'
      - 'dkss_app/models.py'
      - 'dkss_app/master_generations.py'
      - 'dkss_app/account_identity.py'
      - 'dkss_app/document_sources.py'
      - 'dkss_app/analysis_read_cache.py'
      - 'tests/bootstrap_postgres_checks.py'
      - 'tests/test_bootstrap_postgres.py'
      - '.github/workflows/bootstrap-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_bootstrap_ci
          POSTGRES_USER: bootstrap_ci
          POSTGRES_PASSWORD: bootstrap-disposable-ci-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U bootstrap_ci -d dkss_bootstrap_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: .:tests
      DKSS_BOOTSTRAP_REQUIRE_POSTGRES: '1'
      DKSS_BOOTSTRAP_POSTGRES_URL: postgresql+psycopg2://bootstrap_ci:bootstrap-disposable-ci-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dkss_bootstrap_ci
      POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install declared application dependencies
        run: python -m pip install -r requirements.txt
      - name: Mark only this job's owned service container
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          docker exec "$POSTGRES_SERVICE_CONTAINER" psql -U bootstrap_ci -d dkss_bootstrap_ci -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE dkss_bootstrap_ci IS 'DKSS_BOOTSTRAP_SYNTHETIC_ONLY'"
      - name: Validate full initialization and separate connection boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bootstrap-evidence
          git rev-parse HEAD | tee bootstrap-evidence/commit.txt
          python -m unittest -v test_bootstrap_postgres 2>&1 | tee bootstrap-evidence/tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: isolated-postgres-bootstrap-${{ github.sha }}
          path: bootstrap-evidence/
          if-no-files-found: warn
          retention-days: 14
