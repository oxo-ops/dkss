name: Isolated Automatic Analysis Runtime

on:
  push:
    branches: ['validation/analysis-runtime-v3-20261112']
  pull_request:
    paths:
      - 'dkss_app/analysis.py'
      - 'dkss_app/analysis_worker.py'
      - 'gunicorn.conf.py'
      - 'vehicle_analysis_repository.py'
      - 'vehicle_analysis_service.py'
      - 'tests/test_analysis_worker.py'
      - 'tests/test_analysis_worker_postgres.py'
      - 'tests/test_analysis_runtime_*.py'
      - 'tests/run_analysis_runtime_ci.py'
      - 'tests/analysis_runtime_ci_*.py'
      - 'tests/analysis_runtime_ci_guard/**'
      - '.github/workflows/automatic-analysis-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: analysis-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  analysis-runtime:
    if: >-
      github.repository == 'oxo-ops/dkss' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == 'oxo-ops/dkss')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_analysis_runtime_ci
          POSTGRES_USER: analysis_runtime_ci
          POSTGRES_PASSWORD: analysis-runtime-disposable-ci-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U analysis_runtime_ci -d dkss_analysis_runtime_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record and verify exact source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p analysis-runtime-evidence
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          git rev-parse HEAD > analysis-runtime-evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > analysis-runtime-evidence/tree.txt
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install existing declared dependencies
        run: python -m pip install -r requirements.txt
      - name: Mark only the owned disposable service
        shell: bash
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          docker exec "$POSTGRES_SERVICE_CONTAINER" psql -U analysis_runtime_ci -d dkss_analysis_runtime_ci -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE dkss_analysis_runtime_ci IS 'DKSS_ANALYSIS_RUNTIME_SYNTHETIC_ONLY'"
      - name: Run guarded finite PostgreSQL and Gunicorn acceptance
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/analysis-runtime"
          mkdir -p "$ROOT/home" "$ROOT/tmp"
          env -i PATH="$PATH" HOME="$ROOT/home" LANG=C.UTF-8 \
            PYTHONPATH="$PWD/tests/analysis_runtime_ci_guard:$PWD:$PWD/tests" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 FLASK_SKIP_DOTENV=1 \
            RUNNER_TEMP="$RUNNER_TEMP" DKSS_VALIDATION_TMP="$ROOT" TMPDIR="$ROOT/tmp" \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY=oxo-ops/dkss \
            SECRET_KEY=synthetic-analysis-runtime-ci RENDER='' RATELIMIT_STORAGE_URI=memory:// \
            DATABASE_URL='sqlite:///:memory:' \
            ANALYSIS_RUNTIME_POSTGRES_TEST_URL='postgresql+psycopg2://analysis_runtime_ci:analysis-runtime-disposable-ci-only@127.0.0.1:5432/dkss_analysis_runtime_ci' \
            ANALYSIS_RUNTIME_REQUIRE_POSTGRES=1 ANALYSIS_RUNTIME_GUNICORN_TEST=1 \
            DOCUMENT_IMPORT_WORKER_ENABLED=0 VEHICLE_ANALYSIS_WORKER_ENABLED=0 PUBLIC_KNOWLEDGE_ENABLED=0 \
            AWS_EC2_METADATA_DISABLED=true AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            OPENAI_API_KEY='' SMTP_HOST='' S3_BUCKET_NAME='' VAPID_PRIVATE_KEY='' VAPID_PUBLIC_KEY='' \
            python tests/run_analysis_runtime_ci.py 2>&1 | tee analysis-runtime-evidence/tests.log
      - name: Collect synthetic process logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "$RUNNER_TEMP/analysis-runtime" ]]; then
            find "$RUNNER_TEMP/analysis-runtime" -type f \( -name '*.log' -o -name 'calls.jsonl' -o -name 'acceptance.json' \) -exec cp --parents '{}' analysis-runtime-evidence/ \;
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: automatic-analysis-runtime-${{ github.event.pull_request.head.sha || github.sha }}
          path: analysis-runtime-evidence/
          if-no-files-found: error
          retention-days: 14
