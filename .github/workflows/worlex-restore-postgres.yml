name: Synthetic WORLEX Scoped Restore
on:
  push:
    branches: ['verify/worlex-restore-20261104']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_restore_ci
          POSTGRES_USER: restore_ci
          POSTGRES_PASSWORD: restore-disposable-synthetic-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U restore_ci -d dkss_restore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: worlex-scoped-restore-20261104:worlex-scoped-restore-20261104/tests
      WORLEX_REQUIRE_POSTGRES: '1'
      WORLEX_EVIDENCE_DIR: restore-evidence
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_BUCKET_NAME: ''
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      VAPID_PRIVATE_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Mark only the newly owned service container
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          test -n "$POSTGRES_SERVICE_CONTAINER"
          docker exec "$POSTGRES_SERVICE_CONTAINER" psql -U restore_ci -d dkss_restore_ci -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE dkss_restore_ci IS 'WORLEX_RESTORE_SYNTHETIC_ONLY'"
      - name: Run guards and synthetic PostgreSQL restore acceptance
        env:
          WORLEX_TEST_POSTGRES_URL: postgresql+psycopg2://restore_ci:restore-disposable-synthetic-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dkss_restore_ci
        run: |
          set -euo pipefail
          mkdir -p restore-evidence
          git rev-parse HEAD > restore-evidence/commit.txt
          python worlex-scoped-restore-20261104/tests/run_acceptance.py 2>&1 | tee restore-evidence/tests.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: synthetic-worlex-restore-${{ github.sha }}
          path: |
            restore-evidence/commit.txt
            restore-evidence/tests.log
            restore-evidence/summary.json
            restore-evidence/sealed-policy.json
            restore-evidence/tested-code-sha256.json
          if-no-files-found: warn
          retention-days: 14
