name: Synthetic WORLEX Bounded Insert and Preservation
on:
  push:
    branches: ['verify/worlex-batched-insert-20261109']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    if: ${{ github.repository == 'oxo-ops/dkss' && github.ref == 'refs/heads/verify/worlex-batched-insert-20261109' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_restore_ci
          POSTGRES_USER: restore_ci
          POSTGRES_PASSWORD: restore-disposable-synthetic-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U restore_ci -d dkss_restore_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHONPATH: worlex-scoped-restore-20261104:worlex-scoped-restore-20261104/tests
      WORLEX_REQUIRE_POSTGRES: '1'
      WORLEX_EVIDENCE_DIR: restore-evidence
      AWS_EC2_METADATA_DISABLED: 'true'
      S3_BUCKET_NAME: ''
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      VAPID_PRIVATE_KEY: ''
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
          cache: pip
      - run: python worlex-scoped-restore-20261104/tests/install_pure_client.py application
      - name: Enable verified TLS only on the newly owned service container
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
          WORLEX_TEST_POSTGRES_URL: postgresql+pg8000://restore_ci:restore-disposable-synthetic-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dkss_restore_ci
        run: python worlex-scoped-restore-20261104/tests/configure_linux_tls.py
      - name: Run guards and synthetic PostgreSQL restore acceptance
        env:
          WORLEX_TEST_POSTGRES_URL: postgresql+pg8000://restore_ci:restore-disposable-synthetic-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/dkss_restore_ci
        run: |
          set -euo pipefail
          mkdir -p restore-evidence
          git rev-parse HEAD > restore-evidence/commit.txt
          python worlex-scoped-restore-20261104/tests/run_acceptance.py 2>&1 | tee restore-evidence/tests.log
      - name: Create only synthetic Windows directory archive
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: bash worlex-scoped-restore-20261104/tests/windows-ci/make_windows_fixture.sh
      - uses: actions/upload-artifact@v7
        with:
          name: windows-render-fixture-${{ github.sha }}
          path: |
            windows-fixture/synthetic.tar.gz
            windows-fixture/fixture-manifest.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: provisional-linux-worlex-${{ github.sha }}
          path: |
            restore-evidence/commit.txt
            restore-evidence/tests.log
            restore-evidence/summary.json
            restore-evidence/schema-init-failure-*.json
            restore-evidence/full-fixture-coverage.json
            restore-evidence/bounded-insert-*.json
            restore-evidence/disconnect-before-commit.json
            restore-evidence/disconnect-after-commit.json
            restore-evidence/provisional-policy.json
            restore-evidence/tested-code-sha256.json
          if-no-files-found: warn
          retention-days: 14

  windows-render:
    if: ${{ github.repository == 'oxo-ops/dkss' && github.ref == 'refs/heads/verify/worlex-batched-insert-20261109' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: restore
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
      - run: python worlex-scoped-restore-20261104/tests/install_pure_client.py runner
      - uses: actions/download-artifact@v7
        with:
          name: windows-render-fixture-${{ github.sha }}
          path: windows-fixture
      - name: Fetch and hash-verify official PostgreSQL 18.6 portable binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://get.enterprisedb.com/postgresql/postgresql-18.6-5-windows-x64-binaries.zip'
          $expected = 'e2246ba91d22345bc3d017586c09ede52d9df180b1eeb480f050445f1cad84e2'
          $zip = Join-Path $env:RUNNER_TEMP 'postgresql-18.6-binaries.zip'
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Official EDB archive SHA256 mismatch' }
          $dest = Join-Path $env:RUNNER_TEMP 'postgresql-18.6-portable'
          Expand-Archive -Path $zip -DestinationPath $dest
          $binary = Join-Path $dest 'pgsql\bin\pg_restore.exe'
          if (-not (Test-Path $binary)) { throw 'pg_restore.exe absent from official archive' }
          "WORLEX_PG_RESTORE=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          # Provenance: official EDB contributor checksum response in issue #746.
          # No PostgreSQL service is installed and no installer is executed.
      - name: Reproduce original Windows failure then validate candidate on identical synthetic archive
        shell: pwsh
        run: python worlex-scoped-restore-20261104/tests/windows-ci/test_windows_render.py "$env:WORLEX_PG_RESTORE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-worlex-${{ github.sha }}
          path: windows-evidence/summary.json
          if-no-files-found: warn
          retention-days: 14

  windows-client:
    if: ${{ github.repository == 'oxo-ops/dkss' && github.ref == 'refs/heads/verify/worlex-batched-insert-20261109' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Preserve exact application source bytes on the disposable runner
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Install pinned pure client and run full synthetic Windows TLS acceptance
        shell: pwsh
        run: python worlex-scoped-restore-20261104/tests/windows-ci/build_windows_client.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-client-worlex-${{ github.sha }}
          path: |
            windows-client-evidence/commit.txt
            windows-client-evidence/summary.json
            windows-client-evidence/schema-init-failure-*.json
            windows-client-evidence/owned-server-*.json
            windows-client-evidence/provisional-policy.json
            windows-client-evidence/tested-code-sha256.json
            windows-client-evidence/full-fixture-coverage.json
            windows-client-evidence/bounded-insert-*.json
            windows-client-evidence/disconnect-before-commit.json
            windows-client-evidence/disconnect-after-commit.json
            windows-client-evidence/application-wheels/
            windows-client-evidence/sidecar-proof.json
            windows-client-evidence/runtime-proof.json
            windows-client-evidence/stability-proof.json
            windows-client-evidence/dependency-proof.json
            windows-client-evidence/build-proof.json
            windows-client-evidence/client-proof.json
            windows-client-evidence/pure-wheels/
          if-no-files-found: warn
          retention-days: 14

  combined-seal:
    if: ${{ github.repository == 'oxo-ops/dkss' && github.ref == 'refs/heads/verify/worlex-batched-insert-20261109' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    needs: [restore, windows-render, windows-client]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12.14'
      - uses: actions/download-artifact@v7
        with:
          name: provisional-linux-worlex-${{ github.sha }}
          path: linux-evidence
      - uses: actions/download-artifact@v7
        with:
          name: windows-worlex-${{ github.sha }}
          path: windows-evidence
      - uses: actions/download-artifact@v7
        with:
          name: windows-client-worlex-${{ github.sha }}
          path: windows-client-evidence
      - name: Seal only after all three mandatory acceptance jobs pass for identical code
        run: python worlex-scoped-restore-20261104/tests/windows-ci/seal_combined.py
      - uses: actions/upload-artifact@v7
        with:
          name: synthetic-worlex-restore-${{ github.sha }}
          path: combined-evidence/
          if-no-files-found: error
          retention-days: 14
