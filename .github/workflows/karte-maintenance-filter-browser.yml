name: Karte Maintenance Filter Browser
on:
  push:
    branches: [fix/karte-maintenance-filter, validation/karte-filters-followup]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          mkdir -p "$RUNNER_TEMP/create-ui/home" "$RUNNER_TEMP/create-ui/tmp" "$RUNNER_TEMP/create-ui/html" "$RUNNER_TEMP/create-ui/qa"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP/create-ui/home" LANG=C.UTF-8 TMPDIR="$RUNNER_TEMP/create-ui/tmp" DKSS_VALIDATION_TMP="$RUNNER_TEMP/create-ui/tmp" DKSS_BROWSER_ACCEPTANCE_ISOLATED=1 PYTHONPATH="$GITHUB_WORKSPACE/tests/history_presentation_browser/guard" PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/create-ui/html" python tests/header_mobile_browser/render_pages.py
          env -i PATH="$PATH" HOME="$HOME" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/create-ui/html" ARTIFACTS="$RUNNER_TEMP/create-ui/qa" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node tests/karte_maintenance_filter_browser/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: karte-maintenance-filter-ui
          path: ${{ runner.temp }}/create-ui/qa
