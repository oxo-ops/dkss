name: Checklist Toolbar Browser
on:
  push:
    branches: [validation/checklist-toolbar-20261119]
permissions:
  contents: read
jobs:
  checklist-toolbar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: pip install jinja2==3.1.6
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          python tests/checklist_toolbar_browser/render.py "$RUNNER_TEMP/pages"
          node tests/checklist_toolbar_browser/browser.cjs "$RUNNER_TEMP/pages" "$RUNNER_TEMP/qa"
          git rev-parse HEAD > "$RUNNER_TEMP/qa/source-sha.txt"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: checklist-toolbar-${{ github.sha }}
          path: ${{ runner.temp }}/qa/
