name: Driving compact toolbar isolated browser
on:
  push:
    branches: [review/driving-toolbar-20261119]
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          python -m pip install -r requirements.txt
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Exact candidate and synthetic route HTML
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          mkdir -p "$RUNNER_TEMP/driving-toolbar/html" "$RUNNER_TEMP/driving-toolbar/images" "$RUNNER_TEMP/fixture-tmp"
          env -i PATH="$PATH" HOME="$RUNNER_TEMP" LANG=C.UTF-8 PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/driving-toolbar/html" TMPDIR="$RUNNER_TEMP/fixture-tmp" PYTHONPATH="$GITHUB_WORKSPACE/tests/history_presentation_browser/guard" DKSS_VALIDATION_TMP="$RUNNER_TEMP/fixture-tmp" python tests/driving_toolbar_browser/render.py > "$RUNNER_TEMP/driving-toolbar/render.log" 2>&1
          env -i PATH="$PATH" HOME="$HOME" PRODUCT_REPO="$GITHUB_WORKSPACE" HTML_OUT="$RUNNER_TEMP/driving-toolbar/html" ARTIFACTS="$RUNNER_TEMP/driving-toolbar/images" PLAYWRIGHT_MODULE="$RUNNER_TEMP/browser/node_modules/playwright" node tests/driving_toolbar_browser/browser.cjs
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: guide-driving-toolbar-${{ github.sha }}
          path: |
            ${{ runner.temp }}/driving-toolbar/images/
            ${{ runner.temp }}/driving-toolbar/render.log
          retention-days: 7
