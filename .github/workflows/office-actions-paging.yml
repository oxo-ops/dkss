name: Office action category paging browser
on:
  push:
    branches: [validation/office-actions-paging-20261119, 'validation/header-guide-followup-20261119']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: |
          pip install jinja2
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          python tests/dashboard_actions_browser/render.py "$RUNNER_TEMP/actions-fixture"
          node tests/dashboard_actions_browser/browser.cjs "$RUNNER_TEMP/actions-fixture" "$RUNNER_TEMP/actions-results"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/actions-results/head.txt"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: office-actions-${{ github.sha }}
          path: ${{ runner.temp }}/actions-results/

