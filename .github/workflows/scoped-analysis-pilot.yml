name: Scoped analysis pilot offline contract
on:
  pull_request:
    paths:
      - 'tools/quality/scoped_analysis/**'
      - 'tests/test_scoped_analysis_*.py'
      - 'vehicle_karte_analysis_ai.py'
      - 'dkss_app/analysis.py'
      - 'tests/run_scoped_analysis_reader_ci.py'
      - 'tests/run_scoped_analysis_ledger_ci.py'
      - 'vehicle_analysis_risk.py'
      - 'vehicle_priority_inputs.py'
      - 'tests/run_scoped_analysis_pilot_tests.py'
      - '.github/workflows/scoped-analysis-pilot.yml'
permissions:
  contents: read
jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact source
        run: git rev-parse HEAD HEAD^{tree}
      - name: Synthetic network-denied contract
        run: env -i PATH="$PATH" python3 tests/run_scoped_analysis_pilot_tests.py
  scoped-reader-postgres:
    if: github.repository == 'oxo-ops/dkss' && github.event.pull_request.head.repo.full_name == 'oxo-ops/dkss'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_analysis_runtime_ci
          POSTGRES_USER: analysis_runtime_ci
          POSTGRES_PASSWORD: analysis-runtime-disposable-ci-only
          POSTGRES_INITDB_ARGS: '--auth-host=scram-sha-256'
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U analysis_runtime_ci -d dkss_analysis_runtime_ci"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Exact source
        run: git rev-parse HEAD HEAD^{tree}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Existing pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Mark owned disposable PostgreSQL only
        env:
          POSTGRES_SERVICE_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          test -n "$POSTGRES_SERVICE_CONTAINER"
          docker exec "$POSTGRES_SERVICE_CONTAINER" psql -U analysis_runtime_ci -d dkss_analysis_runtime_ci -v ON_ERROR_STOP=1 -c "COMMENT ON DATABASE dkss_analysis_runtime_ci IS 'DKSS_ANALYSIS_RUNTIME_SYNTHETIC_ONLY'"
      - name: Scoped read-only app acceptance and impacted generator regression
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/scoped-reader"
          mkdir -p "$ROOT/home" "$ROOT/tmp"
          env -i PATH="$PATH" HOME="$ROOT/home" LANG=C.UTF-8 \
            PYTHONPATH="$PWD/tests/analysis_runtime_ci_guard:$PWD:$PWD/tests" \
            PYTHONDONTWRITEBYTECODE=1 PYTHONUNBUFFERED=1 FLASK_SKIP_DOTENV=1 \
            RUNNER_TEMP="$RUNNER_TEMP" DKSS_VALIDATION_TMP="$ROOT" TMPDIR="$ROOT/tmp" \
            GITHUB_ACTIONS=true GITHUB_REPOSITORY=oxo-ops/dkss \
            SECRET_KEY=synthetic-scoped-reader RENDER='' RATELIMIT_STORAGE_URI=memory:// \
            DATABASE_URL='sqlite:///:memory:' \
            ANALYSIS_RUNTIME_POSTGRES_TEST_URL='postgresql+psycopg2://analysis_runtime_ci:analysis-runtime-disposable-ci-only@127.0.0.1:5432/dkss_analysis_runtime_ci' \
            ANALYSIS_RUNTIME_REQUIRE_POSTGRES=1 \
            DOCUMENT_IMPORT_WORKER_ENABLED=0 VEHICLE_ANALYSIS_WORKER_ENABLED=0 PUBLIC_KNOWLEDGE_ENABLED=0 \
            AWS_EC2_METADATA_DISABLED=true AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            OPENAI_API_KEY='' SMTP_HOST='' S3_BUCKET_NAME='' VAPID_PRIVATE_KEY='' VAPID_PUBLIC_KEY='' \
            python tests/run_scoped_analysis_reader_ci.py
      - name: Durable local reservation and existing save/UI integration, no network
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/scoped-ledger"
          mkdir -p "$ROOT/home" "$ROOT/tmp"
          env -i PATH="$PATH" HOME="$ROOT/home" LANG=C.UTF-8 \
            PYTHONDONTWRITEBYTECODE=1 FLASK_SKIP_DOTENV=1 \
            RUNNER_TEMP="$RUNNER_TEMP" DKSS_VALIDATION_TMP="$ROOT" TMPDIR="$ROOT/tmp" \
            SECRET_KEY=synthetic-scoped-ledger RENDER='' RATELIMIT_STORAGE_URI=memory:// \
            DATABASE_URL='sqlite:///:memory:' \
            DOCUMENT_IMPORT_WORKER_ENABLED=0 VEHICLE_ANALYSIS_WORKER_ENABLED=0 PUBLIC_KNOWLEDGE_ENABLED=0 \
            AWS_EC2_METADATA_DISABLED=true AWS_CONFIG_FILE=/dev/null AWS_SHARED_CREDENTIALS_FILE=/dev/null \
            OPENAI_API_KEY='' SMTP_HOST='' S3_BUCKET_NAME='' VAPID_PRIVATE_KEY='' VAPID_PUBLIC_KEY='' \
            python tests/run_scoped_analysis_ledger_ci.py
