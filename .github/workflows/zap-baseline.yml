name: ZAP Baseline Scan

on:
  workflow_dispatch:

jobs:
  zap-baseline:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      issues: write

    steps:
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ secrets.ZAP_TARGET_URL }}
          fail_action: true
          allow_issue_writing: false