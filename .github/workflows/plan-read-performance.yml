name: Plan read performance isolated
on:
  push:
    branches: [review/plan-read-performance-20261119]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      DOCUMENT_IMPORT_WORKER_ENABLED: '0'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      PYTHONPATH: '.:tests'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exact candidate and isolated baseline measurements
        run: |
          set -eu
          mkdir -p out
          git rev-parse HEAD > out/tested-head.txt
          cp vehicle_inspection_plans.py /tmp/plan-candidate.py
          git show c35ccb1fbbecf92a0efbb0bc34d73c3faeb57a88:vehicle_inspection_plans.py > vehicle_inspection_plans.py
          python tests/plan_read_performance/probe.py out/before.json
          cp /tmp/plan-candidate.py vehicle_inspection_plans.py
          python tests/plan_read_performance/probe.py out/after.json
          python tests/plan_read_performance/compare.py out/before.json out/after.json > out/comparison.json
          cat out/comparison.json
          git diff --exit-code
      - name: Boundaries, export and notification regressions
        run: python -m unittest discover -s tests -p 'test_inspection_plans.py' -v && python -m unittest discover -s tests -p 'test_inspection_plan_excel.py' -v && python -m unittest discover -s tests -p 'test_q02_inspection_plan_boundaries.py' -v && python -m unittest discover -s tests -p 'test_invoice_plan_actuals.py' -v && python -m unittest discover -s tests -p 'test_inspection_alerts.py' -v
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan-read-performance
          path: out
