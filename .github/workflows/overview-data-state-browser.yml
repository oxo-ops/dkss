name: Combined Overview Data State Browser Acceptance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'tests/overview_data_state_browser/**'
      - '.github/workflows/overview-data-state-browser.yml'

permissions:
  contents: read

concurrency:
  group: overview-data-state-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  synthetic-browser:
    if: github.event.pull_request.head.ref == 'verify/combined-quality-feature-20261110' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out frozen application candidate
        uses: actions/checkout@v7
        with:
          ref: 8d36d64aaa7080e9e53538cf4433a752024e5614
          path: candidate
          persist-credentials: false
          fetch-depth: 1
      - name: Check out this PR's validation harness separately
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: validation
          persist-credentials: false
          sparse-checkout: tests/overview_data_state_browser
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install isolated application and pinned browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r candidate/requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Verify frozen source and run synthetic browser acceptance once
        shell: bash
        env:
          DKSS_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/overview-data-state-browser-results/browser
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overview-data-state-browser-results"
          test "$(git -C candidate rev-parse HEAD)" = 8d36d64aaa7080e9e53538cf4433a752024e5614
          test "$(git -C candidate rev-parse HEAD^{tree})" = 0425395f26bcdfdbd8f7f7e6216b283bdc77e06f
          test -z "$(git -C candidate status --porcelain --untracked-files=all)"
          printf 'candidate=%s\nvalidation=%s\ntree=%s\n' "$(git -C candidate rev-parse HEAD)" "$(git -C validation rev-parse HEAD)" "$(git -C candidate rev-parse HEAD^{tree})" > "$RUNNER_TEMP/overview-data-state-browser-results/source-identity.txt"
          chromium=$("$RUNNER_TEMP/browser-venv/bin/python" - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              print(p.chromium.executable_path)
          PY
          )
          test -x "$chromium"
          bash "$GITHUB_WORKSPACE/validation/tests/overview_data_state_browser/run-isolated.sh" \
            "$GITHUB_WORKSPACE/candidate" "$RUNNER_TEMP/browser-venv/bin/python" \
            --run-browser --chromium "$chromium" \
            2>&1 | tee "$RUNNER_TEMP/overview-data-state-browser-results/browser.log"
      - name: Save synthetic browser reports and screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: overview-data-state-browser-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/overview-data-state-browser-results/
          if-no-files-found: warn
          retention-days: 14
