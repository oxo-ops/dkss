name: First use guide isolated browser
on:
  pull_request:
    paths: ['templates/partials/first_use_guide.html', 'static/js/first_use_guide.js', 'static/css/first_use_guide.css', 'tests/first_use_guide_browser/**', '.github/workflows/first-use-guide-browser.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.62.0 Jinja2==3.1.6 && python -m playwright install --with-deps chromium
      - name: Synthetic guide only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          GUIDE_ARTIFACT_DIR: ${{ runner.temp }}/guide-browser-output
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          env -i PATH="$PATH" HOME="$HOME" GUIDE_ARTIFACT_DIR="$GUIDE_ARTIFACT_DIR" python tests/first_use_guide_browser/acceptance.py
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: first-use-guide-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/guide-browser-output/
          retention-days: 7
