name: Test-only session authority integration

on:
  pull_request:
    paths:
      - 'dkss_app/auth.py'
      - 'dkss_app/http.py'
      - 'dkss_app/access.py'
      - 'dkss_app/audit.py'
      - 'dkss_app/analysis_feedback.py'
      - 'dkss_app/models.py'
      - 'dkss_app/__init__.py'
      - 'dkss_app/routes.py'
      - 'dkss_app/common.py'
      - 'requirements.txt'
      - 'tests/test_session_authority_candidate.py'
      - 'dkss_app/session_authority*.py'
      - 'dkss_app/auth_session_registry.py'
      - 'tests/test_auth_session_registry.py'
      - 'tests/test_auth_registry_pg_capacity.py'
      - 'templates/session_switch_conflict.html'
      - 'templates/auth_registry_unavailable.html'
      - '.github/workflows/session-authority-candidate.yml'
  push:
    branches: [main]
    paths:
      - 'dkss_app/auth.py'
      - 'dkss_app/http.py'
      - 'dkss_app/access.py'
      - 'dkss_app/audit.py'
      - 'dkss_app/analysis_feedback.py'
      - 'dkss_app/models.py'
      - 'dkss_app/__init__.py'
      - 'dkss_app/routes.py'
      - 'dkss_app/common.py'
      - 'requirements.txt'
      - 'tests/test_session_authority_candidate.py'
      - 'dkss_app/session_authority*.py'
      - 'dkss_app/auth_session_registry.py'
      - 'tests/test_auth_session_registry.py'
      - 'tests/test_auth_registry_pg_capacity.py'
      - 'templates/session_switch_conflict.html'
      - 'templates/auth_registry_unavailable.html'
      - '.github/workflows/session-authority-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-session-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q02_ci
          POSTGRES_USER: q02
          POSTGRES_PASSWORD: q02-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q02 -d dkss_q02_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SESSION_AUTHORITY_POSTGRES_TEST_URL: postgresql+psycopg2://q02:q02-disposable-ci-only@127.0.0.1:5432/dkss_q02_ci
      SESSION_AUTHORITY_REQUIRE_POSTGRES: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact tested source
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'tested_head=%s\ntested_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify real-app session authority on PostgreSQL
        run: |
          python -m unittest discover -s tests -p 'test_session_authority_candidate.py' -v
          python -m unittest discover -s tests -p 'test_auth_session_registry.py' -v
          python -m unittest discover -s tests -p 'test_auth_registry_pg_capacity.py' -v
