name: Usable Pending Plan List
on:
  push:
    branches: [validation/plan-pending-usable]
permissions:
  contents: read
jobs:
  plan-pending:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: |
          npm install --prefix "$RUNNER_TEMP/browser" playwright@1.62.0
          "$RUNNER_TEMP/browser/node_modules/.bin/playwright" install --with-deps chromium
      - run: |
          node tests/calendar_stable_height.cjs
          CHROME=$(node -e 'console.log(require(process.env.PLAYWRIGHT_MODULE).chromium.executablePath())')
          bash tests/plan_pending_browser/run.sh "$GITHUB_WORKSPACE" "$(command -v python)" "$RUNNER_TEMP/plan-pending" "$CHROME"
          git rev-parse HEAD > "$RUNNER_TEMP/plan-pending/source-sha.txt"
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/browser/node_modules/playwright
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: plan-pending-${{ github.sha }}
          path: ${{ runner.temp }}/plan-pending/
