name: Q09 Atomic Collection History
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'tools/quality/log_observation_ledger/**'
      - '.github/workflows/q09-history-integration.yml'
permissions:
  contents: read
jobs:
  synthetic-history:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify exact head and isolated synthetic integration
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=all)"
          printf 'tested_head=%s\ntested_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"
          python_bin=$(command -v python)
          cd tools/quality/log_observation_ledger
          sha256sum --check SHA256SUMS
          env -i "$python_bin" -I -B - <<'PY'
          import pathlib, sys, unittest
          sys.path.insert(0, str(pathlib.Path.cwd()))
          import test_integrated_monitor
          suite = unittest.defaultTestLoader.loadTestsFromModule(test_integrated_monitor)
          if suite.countTestCases() != 18:
              raise SystemExit('UNEXPECTED_HISTORY_TEST_COUNT')
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          raise SystemExit(0 if result.wasSuccessful() and result.testsRun == 18 and not result.skipped else 1)
          PY
