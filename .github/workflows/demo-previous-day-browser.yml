name: Demo previous-day integration browser
on:
  pull_request:
    paths: ['tests/demo_previous_day_browser/**', '.github/workflows/demo-previous-day-browser.yml']
permissions:
  contents: read
jobs:
  synthetic:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Isolated browser dependencies
        run: |
          python -m venv "$RUNNER_TEMP/browser-venv"
          "$RUNNER_TEMP/browser-venv/bin/python" -m pip install -r requirements.txt playwright==1.62.0
          "$RUNNER_TEMP/browser-venv/bin/python" -m playwright install --with-deps chromium
      - name: Verify exact candidate and real two-context cookies
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain)"
          PY="$RUNNER_TEMP/browser-venv/bin/python"
          CHROMIUM=$("$PY" -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')
          bash tests/demo_previous_day_browser/run.sh "$PY" "$CHROMIUM" "$RUNNER_TEMP/demo-previous-output"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: demo-previous-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/demo-previous-output/
          retention-days: 7
