name: Q08 Account Identity

on:
  pull_request:
    paths:
      - 'dkss_app/**'
      - 'templates/itc_news_form.html'
      - 'tests/test_q08_*.py'
      - 'tests/identity_fixture.py'
      - 'tests/test_workflow_regressions.py'
      - 'requirements.txt'
      - '.github/workflows/q08-account-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dkss_q08_ci
          POSTGRES_USER: q08
          POSTGRES_PASSWORD: q08-disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U q08 -d dkss_q08_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PYTHONPATH: .:tests
      Q08_POSTGRES_TEST_URL: postgresql+psycopg2://q08:q08-disposable-ci-only@127.0.0.1:5432/dkss_q08_ci
      AWS_EC2_METADATA_DISABLED: 'true'
      OPENAI_API_KEY: ''
      SMTP_HOST: ''
      S3_BUCKET_NAME: ''
      VAPID_PRIVATE_KEY: ''
      VAPID_PUBLIC_KEY: ''
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify SQLite and PostgreSQL identity and NULL-state boundaries
        shell: bash
        run: |
          set -o pipefail
          python -m unittest -v \
            test_q08_account_identity.AccountIdentityTests \
            test_q08_account_identity.IdentityMigrationTests \
            test_q08_vehicle_null_capacity.VehicleNullCapacityTests \
            test_q08_postgres_identity.PostgresAccountIdentityTests \
            test_q08_postgres_identity.PostgresNullCapacityTests \
            test_q08_driving_generation.DrivingGenerationTests \
            test_q08_postgres_driving_generation.PostgresDrivingGenerationTests \
            test_q08_reminder_generation.ReminderGenerationTests \
            test_q08_postgres_reminder_generation.PostgresReminderGenerationTests \
            test_q08_vehicle_origin_generation.VehicleOriginGenerationTests \
            test_q08_postgres_vehicle_origin_generation.PostgresVehicleOriginGenerationTests \
            test_q08_news_generation.NewsGenerationTests \
            test_q08_postgres_news_generation.PostgresNewsGenerationTests \
            2>&1 | tee q08-identity-results.log
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: q08-identity-results
          path: q08-identity-results.log
          retention-days: 7
