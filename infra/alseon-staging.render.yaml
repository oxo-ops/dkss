services:
  - type: pserv
    name: alseon-staging-d01
    runtime: docker
    region: oregon
    plan: 0.5c-512mb
    branch: staging/d01-private-package
    dockerfilePath: ./infra/D01-stage.Dockerfile
    dockerContext: .
    autoDeployTrigger: 'off'
    preDeployCommand: /bin/sh /app/infra/d01-stage-start.sh init
    envVars:
      - key: ALSEON_STAGING_ONLY
        value: '1'
      - key: STAGING_PACKAGE_SHA
        value: '4d8c39b2291384a4dd89f218a38f0753d828fef3'
      - key: SECRET_KEY
        generateValue: true
      - key: ITC_INITIAL_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alseon-staging-pg18
          property: connectionString
      - key: STAGING_DB_HOST
        fromDatabase:
          name: alseon-staging-pg18
          property: host
      - key: MFA_ENABLED
        value: 'false'
      - key: DOCUMENT_IMPORT_WORKER_ENABLED
        value: '0'
      - key: VEHICLE_ANALYSIS_WORKER_ENABLED
        value: '0'
      - key: PUBLIC_KNOWLEDGE_ENABLED
        value: '0'
databases:
  - name: alseon-staging-pg18
    databaseName: alseon_staging
    user: alseon_staging
    postgresMajorVersion: '18'
    plan: 0.1c-256mb
    region: oregon
    diskSizeGB: 1
    ipAllowList: []
    storageAutoscalingEnabled: false
