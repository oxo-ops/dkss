{% extends "base.html" %}

{% block title %}
ログイン
{% endblock %}

{% block content %}

<h2>ログイン</h2>

<form
    method="post"
    action="{{ url_for('login') }}"
    id="dkss-login-form"
    data-csrf-url="{{ url_for('login_csrf_token') }}"
>
    <input
        type="hidden"
        name="csrf_token"
        value="{{ csrf_token() }}"
    >

    {% if error %}
        <p class="error-text">{{ error }}</p>
    {% endif %}

    <p
        id="login-submit-error"
        class="error-text"
        role="alert"
        hidden
    ></p>

    <div>
        <label>会社コード</label>
        <input
            type="text"
            name="company_code"
            value="{{ request.form.get('company_code', request.args.get('company_code', '')) }}"
        >
    </div>

    <div>
        <label>ユーザーID</label>
        <input
            type="text"
            name="username"
            value="{{ request.form.get('username', '') }}"
            autocomplete="username"
        >
    </div>

    <div>
        <label>パスワード</label>
        <input
            type="password"
            name="password"
            autocomplete="current-password"
        >
    </div>

    <button type="submit">ログイン</button>

    <div class="form-link">
        <a href="/register">
            初回登録はこちら
        </a>
    </div>
</form>

<script
    src="{{ url_for('static', filename='js/login.js', v='20261009-1') }}"
    defer
></script>

{% endblock %}
