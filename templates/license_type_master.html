{% extends "base.html" %}

{% block title %}免許種別マスタ{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-actions">
        <a href="/master/license-types/new" class="btn">
            新規登録
        </a>
    </div>
</div>

<p class="master-order-help">右端のハンドルをドラッグして並べ替え<span class="master-order-status" role="status" aria-live="polite"></span></p>
<table class="master-order-table" data-master-order-url="/master/license-types/order">
    <thead>
    <tr>
        <th>免許種別</th>
        <th class="col-actions">操作</th>
    </tr>
    </thead>
    <tbody>

    {% for item in license_types %}
    <tr data-master-id="{{ item.id }}">
        <td>{{ item.name }}</td>

        <td class="action-cell">
            <div class="action-buttons">

                <a
                    href="/master/license-types/{{ item.id }}/edit"
                    class="btn-small btn-edit"
                >
                    編集
                </a>

                <form
                    method="post"
                    action="/master/license-types/{{ item.id }}/delete"
                    data-confirm-message="削除しますか？"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button
                        type="submit"
                        class="btn-small btn-delete"
                    >
                        削除
                    </button>
                </form>
                <button type="button" class="master-order-handle" aria-label="{{ item.name }}の表示順を変更" title="ドラッグで移動／↑↓キーで移動">
                    <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true" focusable="false">
                        <circle cx="4" cy="4" r="1"/><circle cx="8" cy="4" r="1"/>
                        <circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/>
                        <circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/>
                    </svg>
                </button>

            </div>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>

{% endblock %}
