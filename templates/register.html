{% extends "base.html" %}

{% block title %}初回登録{% endblock %}

{% block content %}

<div class="page-header">
    <h2>初回登録</h2>

    <div class="header-actions">
        <a href="/login" class="btn btn-back">
            ← ログインへ戻る
        </a>
    </div>
</div>

<div class="card form-card register-card">
    <form
        method="post"
        action="{{ url_for('register', company_code=company_code) }}"
        class="responsive-form register-form"
    >
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {% if error %}
        <div class="alert danger">
            {{ error }}
        </div>
    {% endif %}

    <label>会社コード</label>
    <input
        type="text"
        value="{{ company_code }}"
        readonly
    >

    <label>氏名</label>
    <input
        type="text"
        name="name"
        value="{{ request.form.get('name', '') }}"
        maxlength="100"
        autocomplete="name"
        required
    >

    <label>メールアドレス（任意）</label>
    <input
        type="email"
        name="email_address"
        value="{{ request.form.get('email_address', '') }}"
        maxlength="255"
        autocomplete="email"
        placeholder="example@isz.co.jp"
    >

    <label>ログインID</label>
    <input
        type="text"
        name="employee_id"
        value="{{ request.form.get('employee_id', '') }}"
        maxlength="50"
        autocomplete="username"
        required
    >

    <label>パスワード</label>
    <div class="password-field">
        <input
            type="password"
            name="password"
            id="password"
            minlength="8"
            maxlength="128"
            autocomplete="new-password"
            aria-describedby="passwordHelp"
            required
        >

        <button
            type="button"
            class="password-eye js-password-toggle"
            aria-label="パスワードを表示"
            title="パスワードを表示"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />
                <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />
            </svg>
        </button>
    </div>

    <p id="passwordHelp" class="help-text">
        8文字以上で、英大文字・英小文字・数字・記号のうち
        3種類以上を使用してください。
    </p>

    <label>営業所</label>
    <select name="office">
        <option value="">未設定</option>
        {% for office in offices %}
            <option
                value="{{ office.name }}"
                {% if request.form.get('office', '') == office.name %}
                    selected
                {% endif %}
            >
                {{ office.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="btn">
        登録
    </button>

    </form>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

{% endblock %}
