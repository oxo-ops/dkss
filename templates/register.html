{% extends "base.html" %}

{% block title %}初回登録{% endblock %}

{% block content %}

<div class="page-header">
    <h2>初回登録</h2>

    <div class="header-actions">
        <a href="/login" class="btn btn-back">
            ← ログインへ戻る
        </a>
    </div>
</div>

<div class="card form-card register-card">
    <form method="post" class="responsive-form register-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {% if error %}
        <div class="alert danger">
            {{ error }}
        </div>
    {% endif %}

    <label>会社コード</label>
    <input
        type="text"
        value="{{ company_code }}"
        readonly
    >

    <label>氏名</label>
    <input
        type="text"
        name="name"
        required
    >

    <label>ログインID</label>
    <input
        type="text"
        name="employee_id"
        required
    >

    <label>パスワード</label>
    <div class="password-field">
        <input
            type="password"
            name="password"
            id="password"
            required
        >

        <button
            type="button"
            class="password-eye js-password-toggle"
            aria-label="パスワードを表示"
            title="パスワードを表示"
        >
            <svg
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />
                <circle
                    cx="12"
                    cy="12"
                    r="3"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                />
            </svg>
        </button>
    </div>

    <label>営業所</label>
    <select name="office">
        <option value="">未設定</option>
        {% for office in offices %}
            <option value="{{ office.name }}">
                {{ office.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="btn">
        登録
    </button>

    </form>
</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

{% endblock %}
