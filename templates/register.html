{% extends "base.html" %}

{% block title %}初回登録{% endblock %}

{% block content %}

<div class="page-header">
    <h2>初回登録</h2>

    <div class="header-actions">
        <a href="/login" class="btn btn-back">
            ← ログインへ戻る
        </a>
    </div>
</div>

<form method="post" class="card register-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    {% if error %}
        <div class="alert danger">
            {{ error }}
        </div>
    {% endif %}

    <label>会社コード</label>
    <input
        type="text"
        value="{{ company_code }}"
        readonly
    >

    <label>氏名</label>
    <input
        type="text"
        name="name"
        required
    >

    <label>ログインID</label>
    <input
        type="text"
        name="employee_id"
        required
    >

    <label>パスワード</label>
    <input
        type="password"
        name="password"
        id="password"
        required
    >

    <label class="password-toggle">
        <input
            type="checkbox"
            class="js-password-toggle"
        >
        パスワードを表示
    </label>

    <label>営業所</label>
    <select name="office">
        <option value="">未設定</option>
        {% for office in offices %}
            <option value="{{ office.name }}">
                {{ office.name }}
            </option>
        {% endfor %}
    </select>

    <button type="submit" class="btn">
        登録
    </button>

</form>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

{% endblock %}
