{% extends "base.html" %}

{% block title %}安全パトロール内容区分マスタ{% endblock %}

{% block content %}

<div class="page-header">
    <h2>安全パトロール内容区分マスタ</h2>

    <div class="header-actions">
        <a href="/master/patrol-content-types/new" class="btn">
            新規登録
        </a>
    </div>
</div>

<p class="master-order-help">右端のハンドルをドラッグして並べ替え<span class="master-order-status" role="status" aria-live="polite"></span></p>
<div class="table-scroll responsive-table-viewport"><table class="master-order-table" data-master-order-url="/master/patrol-content-types/order">
    <thead>
    <tr>
        <th>内容区分名</th>
        <th class="col-actions">操作</th>
    </tr>
    </thead>
    <tbody>

    {% for content_type in content_types %}
    <tr data-master-id="{{ content_type.id }}">
        <td>{{ content_type.name }}</td>

        <td class="action-cell">
            <div class="action-buttons">
                <a href="/master/patrol-content-types/{{ content_type.id }}/edit" class="btn-small btn-edit">
                    編集
                </a>

                <form
                    method="post"
                    action="/master/patrol-content-types/{{ content_type.id }}/delete"
                    class="js-patrol-content-type-delete-form"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn-small btn-delete">
                        削除
                    </button>
                </form>
                <button type="button" class="master-order-handle" aria-label="{{ content_type.name }}の表示順を変更" title="ドラッグで移動／↑↓キーで移動">
                    <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true" focusable="false">
                        <circle cx="4" cy="4" r="1"/><circle cx="8" cy="4" r="1"/>
                        <circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/>
                        <circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="2">内容区分が登録されていません。</td>
    </tr>
    {% endfor %}
    </tbody>
</table></div>

<script src="{{ url_for('static', filename='js/patrol_content_type_master.js') }}"></script>

{% endblock %}
