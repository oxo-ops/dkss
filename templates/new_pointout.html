{% extends "base.html" %}

{% block title %}安全パトロール結果登録{% endblock %}

{% block content %}

<div class="page-header">
    <h2>安全パトロール結果登録</h2>
</div>

<div class="card form-card">

    <form method="post" enctype="multipart/form-data" class="responsive-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="form-group">
            <label>発生日</label>
            <input
                type="date"
                name="date"
                id="event_date"
            >
        </div>

        <div class="form-group">
            <label>分類</label>
            <select name="category">
                <option value="安全">安全</option>
                <option value="品質">品質</option>
                <option value="Good">Good</option>
            </select>
        </div>

        <div class="form-group">
            <label>対象区分</label>

            <div class="button-group">
                <button
                    type="button"
                    class="choice-btn active js-target-type-button"
                    data-target-type="user"
                >
                    個人
                </button>

                <button
                    type="button"
                    class="choice-btn js-target-type-button"
                    data-target-type="delivery_place"
                >
                    納入先
                </button>
            </div>

            <input type="hidden" name="target_type" id="target_type" value="user">
        </div>

        <div id="user_target_area" class="form-group">
            <label>対象者</label>

            <input
                type="text"
                id="target_user_search"
                placeholder="氏名を入力"
                autocomplete="off"
            >

            <input
                type="hidden"
                name="target_user"
                id="target_user"
            >

            <div
                id="driver_search_results"
                class="vehicle-select-box is-hidden"
            ></div>

            <div id="driver_search_data" class="is-hidden">
                {% for driver in drivers %}
                    <span
                        data-name="{{ driver.name }}"
                        data-employee-id="{{ driver.employee_id }}"
                    ></span>
                {% endfor %}
            </div>
        </div>

        <div id="delivery_place_area" class="form-group is-hidden">
            <label>納入先</label>

            <input
                type="text"
                name="delivery_place"
                list="delivery_place_list"
                placeholder="納入先名を入力"
            >

            <datalist id="delivery_place_list">
                {% for place in delivery_places %}
                    <option value="{{ place.name }}">
                {% endfor %}
            </datalist>
        </div>

        <div class="form-group">
            <label>内容区分</label>
            <select name="content_type" required>
                {% for content_type in content_types %}
                    <option value="{{ content_type.name }}">
                        {{ content_type.name }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="card manual-card">
            <h3>マニュアル参照</h3>

            <p class="help-text">
                登録前に関連マニュアルを確認できます。
            </p>

            <select
                id="manual_select"
                class="js-manual-select"
            >
                <option value="">
                    マニュアルを選択してください
                </option>

                {% for manual in manuals %}
                <option
                    value="{{ url_for('static', filename='manuals/' + manual.filename) }}"
                >
                    {{ manual.category }}｜{{ manual.title }}
                </option>
                {% endfor %}
            </select>

            <div class="manual-link-area">
                <a
                    id="manual_link"
                    class="btn is-hidden"
                    target="_blank"
                >
                    マニュアルを開く
                </a>
            </div>
        </div>

        <div class="form-group">
            <label>内容</label>
            <textarea
                name="content"
                class="mention-input"
                rows="5"
                placeholder="内容を入力してください"
            ></textarea>
        </div>

        <div class="form-group">
            <label>添付ファイル</label>

            <input
                type="file"
                name="files"
                id="files"
                class="js-pointout-files"
                multiple
                accept="image/*,video/*,.pdf"
            >

            <div id="preview_area" class="preview-area"></div>

            <p class="help-text">
                Ctrlキーを押しながら選択すると複数選択できます。
            </p>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn">
                登録
            </button>
        </div>

    </form>

</div>

<div class="form-bottom-actions">
    <a href="/pointouts" class="btn btn-back">
        ← 一覧へ戻る
    </a>
</div>

<script src="{{ url_for('static', filename='js/new_pointout.js') }}"></script>

{% endblock %}
