{% extends "base.html" %}

{% block title %}マニュアルマスタ{% endblock %}

{% block content %}


<div class="page-header">
    <h2>マニュアルマスタ</h2>

    <div class="header-actions">
        <a href="/master/manuals/new" class="btn">
            新規登録
        </a>
    </div>
</div>

<div class="table-scroll">
<p class="master-order-help">右端のハンドルをドラッグして並べ替え<span class="master-order-status" role="status" aria-live="polite"></span></p>
<table class="responsive-table manual-master-table master-order-table" data-master-order-url="/master/manuals/order">
    <thead>
    <tr>
        <th>タイトル</th>
        <th>分類</th>
        <th>ファイル</th>
        <th class="col-actions-wide">操作</th>
    </tr>
    </thead>
    <tbody>

    {% for manual in manuals %}
    <tr data-master-id="{{ manual.id }}">
        <td>{{ manual.title }}</td>
        <td>{{ manual.category }}</td>

        <td>
            {% if manual.filename %}
                <a
                    href="{{ url_for('static', filename='manuals/' + manual.filename) }}"
                    target="_blank"
                >
                    開く
                </a>
            {% else %}
                未登録
            {% endif %}
        </td>

        <td class="action-cell">
            <div class="action-buttons">
                <a
                    href="/master/manuals/{{ manual.id }}/edit"
                    class="btn-small btn-edit"
                >
                    編集
                </a>

                <form
                    method="post"
                    action="/master/manuals/{{ manual.id }}/delete"
                    data-confirm-message="このマニュアルを削除しますか？"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn-small btn-delete">
                        削除
                    </button>
                </form>
                <button type="button" class="master-order-handle" aria-label="{{ manual.title }}の表示順を変更" title="ドラッグで移動／↑↓キーで移動">
                    <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true" focusable="false">
                        <circle cx="4" cy="4" r="1"/><circle cx="8" cy="4" r="1"/>
                        <circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/>
                        <circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </td>
    </tr>
    {% endfor %}
    </tbody>
</table>
</div>

{% endblock %}
