{% extends "base.html" %}

{% block title %}納入先一括登録完了{% endblock %}

{% block content %}

<div class="page-header">
    <h2>納入先一括登録完了</h2>
</div>

<div class="card">

    <h3 style="margin-top:0;">
        Excel一括登録が完了しました
    </h3>

    <div
        style="
            display:flex;
            gap:20px;
            flex-wrap:wrap;
            margin:24px 0;
        "
    >

        <div class="summary-card">
            <div class="summary-title">
                新規登録
            </div>

            <div class="summary-value good">
                {{ registered_count }}
            </div>

            <div class="summary-unit">
                件
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-title">
                登録済み
            </div>

            <div class="summary-value">
                {{ existing_count }}
            </div>

            <div class="summary-unit">
                件
            </div>
        </div>

        <div class="summary-card">
            <div class="summary-title">
                Excel内重複
            </div>

            <div class="summary-value">
                {{ duplicate_count }}
            </div>

            <div class="summary-unit">
                件
            </div>
        </div>

    </div>

    <div class="form-actions">

        <a
            href="/master/delivery-places"
            class="btn"
        >
            納入先マスターへ戻る
        </a>

        <a
            href="/master/delivery-places/import"
            class="btn btn-back"
        >
            別のExcelを読み込む
        </a>

    </div>

</div>

{% endblock %}
