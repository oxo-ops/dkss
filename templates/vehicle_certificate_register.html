{% extends "base.html" %}
{% block title %}車検証の読取・確認{% endblock %}

{% block content %}
<link rel="stylesheet"
      href="{{ url_for('static', filename='css/maintenance_invoice_preview.css') }}">

<div class="invoice-review-page vehicle-certificate-review">

    <nav class="page-breadcrumb" aria-label="パンくずリスト">
        <a href="{{ url_for('dashboard') }}">ホーム</a>
        <span class="breadcrumb-separator">›</span>
        <span>車両管理</span>
        <span class="breadcrumb-separator">›</span>
        <a href="{{ url_for('vehicle_registration_method') }}">車両登録</a>
        <span class="breadcrumb-separator">›</span>
        <span aria-current="page">車検証を読み取る</span>
    </nav>

    <div class="invoice-page-heading">
        <h2>車検証の読取・確認</h2>
    </div>

    <section class="invoice-document">
        <div class="invoice-document-heading">
            <span id="certificate-file-label">
                車検証を選択してください
            </span>
        </div>

        <form id="certificate-upload-form"
              class="import-form"
              enctype="multipart/form-data" novalidate>

            <input type="hidden"
                   name="csrf_token"
                   value="{{ csrf_token() }}">

            <label class="import-dropzone"
                   for="certificate-file">
                <span class="import-drop-copy">
                    <strong>PDF・画像をここにドロップ</strong>
                    <small>
                        PDF・PNG・JPEG／1ファイル20MBまで
                    </small>
                </span>

                <span class="import-pick-button">
                    ファイルを選ぶ
                </span>

                <input type="file"
                       id="certificate-file"
                       name="certificate"
                       accept=".pdf,.png,.jpg,.jpeg"
                       required>
            </label>

            <progress id="certificate-progress" class="import-progress" max="100" aria-label="ファイルの送信・読み取り状況" hidden></progress>

            <p id="certificate-status"
               class="import-file-status"
               role="status">
                ファイル未選択
            </p>

            <p id="certificate-error"
               class="import-error"
               role="alert"
               hidden></p>

            <div class="import-actions">
                <button type="button" id="certificate-clear" class="btn btn-outline import-clear" hidden>選択をクリア</button>
                <button type="submit"
                        class="btn btn-outline"
                        id="certificate-read-button" disabled>
                    読み込んで確認
                </button>
            </div>
        </form>
    </section>

    <section id="certificate-review"
             class="invoice-document"
             hidden>

        <div class="invoice-document-heading">
            <span>車検証の読取結果</span>
        </div>

        <div class="invoice-review-layout">

            <aside class="invoice-source-panel">
                <details class="invoice-source-disclosure" open>
                    <summary>原本</summary>

                    <div id="certificate-source-container">
                        <template id="certificate-pdf-template">
                            {% set pdf_source_url = "" %}
                            {% set pdf_filename = "" %}
                            {% set pdf_record_key = "" %}
                            {% include "vehicle_document_pdf_viewer.html" %}
                        </template>
                    </div>
                </details>
            </aside>

            <div class="invoice-records">
                <section class="invoice-record">
                    <div class="invoice-overview">
                        <div class="invoice-record-heading">
                            <div>
                                <p class="invoice-eyebrow">
                                    AI読取結果
                                </p>
                                <h3>登録する車両の情報</h3>
                                <p class="invoice-key-facts">
                                    原本を確認しながら修正してください。
                                </p>
                            </div>
                        </div>

                        <div id="certificate-fields-container">
                            {% include "vehicle_certificate_fields.html" %}
                        </div>
                    </div>
                </section>
            </div>

        </div>

        <div class="form-actions invoice-submit-actions">
            <button type="button"
                    class="btn invoice-primary-action"
                    id="certificate-continue-button"
                    disabled>
                登録内容を確認
            </button>
        </div>
    </section>
</div>
<script src="{{ url_for('static', filename='js/vehicle_certificate_register.js') }}" defer></script>
{% endblock %}
