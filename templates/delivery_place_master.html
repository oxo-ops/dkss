{% extends "base.html" %}

{% block title %}納入先マスタ{% endblock %}

{% block content %}
<div class="page-header">
    <div class="header-actions">
        <a href="/master/delivery-places/import" class="btn">
            Excel一括登録
        </a>

        <a href="/master/delivery-places/new" class="btn">
            新規登録
        </a>
    </div>
</div>

<p class="master-order-help">右端のハンドルをドラッグして並べ替え<span class="master-order-status" role="status" aria-live="polite"></span></p>
<div class="table-scroll responsive-table-viewport"><table class="master-order-table" data-master-order-url="/master/delivery-places/order">
    <thead>
    <tr>
        <th>納入先名</th>
        <th class="col-actions">操作</th>
    </tr>
    </thead>
    <tbody>

    {% for place in delivery_places %}
    <tr data-master-id="{{ place.id }}">
        <td>{{ place.name }}</td>

        <td class="action-cell">
            <div class="action-buttons">
                <a
                    href="/master/delivery-places/{{ place.id }}/edit"
                    class="btn-small btn-edit"
                >
                    編集
                </a>

                <form
                    method="post"
                    action="/master/delivery-places/{{ place.id }}/delete"
                    data-confirm-message="この納入先を削除しますか？"
                >
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="btn-small btn-delete">
                        削除
                    </button>
                </form>
                <button type="button" class="master-order-handle" aria-label="{{ place.name }}の表示順を変更" title="ドラッグで移動／↑↓キーで移動">
                    <svg width="12" height="16" viewBox="0 0 12 16" fill="currentColor" aria-hidden="true" focusable="false">
                        <circle cx="4" cy="4" r="1"/><circle cx="8" cy="4" r="1"/>
                        <circle cx="4" cy="8" r="1"/><circle cx="8" cy="8" r="1"/>
                        <circle cx="4" cy="12" r="1"/><circle cx="8" cy="12" r="1"/>
                    </svg>
                </button>
            </div>
        </td>
    </tr>
    {% else %}
    <tr>
        <td colspan="2">納入先が登録されていません。</td>
    </tr>
    {% endfor %}
    </tbody>
</table></div>

{% endblock %}
