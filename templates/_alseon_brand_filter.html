{# Reproduce the supplied board's dark-background variant without altering PNGs.
   Matrix maps navy to white, preserves blue accent and every source alpha. #}
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute;pointer-events:none">
  <defs>
    <filter id="alseon-dark-logo" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0 1.961538 -1.961538 0 1.315385 0 1.338462 -1.338462 0 1.215204 0 .023077 -.023077 0 1.003710 0 0 0 1 0"/>
    </filter>
  </defs>
</svg>
