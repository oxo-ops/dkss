{% if driving_is_admin and insights.reader_count %}<details class="driving-reader-setting" id="reader-setting"><summary>この乗務員の本人アカウントを設定</summary><p class="driving-muted">現在の期間・絞り込みに含まれる日報 {{ insights.reader_count }}件が対象です。原本の氏名・コードと本人を確認してください。確認した対応は、同じ会社・出力システム・乗務員コード・氏名の後続日報にも再利用します。</p><form method="post" action="{{ url_for('driving_report_readers') }}" class="driving-reader-form">{% for key,value in filter_query.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="reader_version" value="{{ insights.reader_version }}"><input type="hidden" name="return_to" value="{{ url_for('driving_reports',**dict(filter_query,_anchor='driver-trend')) }}"><label>本人アカウント<select name="reader_username" required><option value="" disabled selected>選択してください</option>{% for user in reader_users %}<option value="{{ user.username }}">{{ user.last_name }}{{ user.first_name or '' }}（{{ user.username }}）</option>{% endfor %}<option value="__revoke__">設定を解除・非公開にする</option></select></label><button class="btn btn-outline" type="submit">対象{{ insights.reader_count }}件の閲覧設定を保存</button></form></details>{% endif %}
