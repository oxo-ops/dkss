{% if driving_is_admin and insights.reader_count and not insights.selected_driver.reader_confirmed %}<details open class="driving-reader-setting" id="reader-setting"><summary>乗務員を選択</summary><p class="driving-muted">現在の期間・絞り込みに含まれる日報 {{ insights.reader_count }}件が対象です。自動で特定できないため、該当するアカウントを選択してください。</p><form method="post" action="{{ url_for('driving_report_readers') }}" class="driving-reader-form">{% for key,value in filter_query.items() %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="person_selection_token" value="{{ driving_person_selection() }}"><input type="hidden" name="reader_version" value="{{ insights.reader_version }}"><input type="hidden" name="return_to" value="{{ url_for('driving_reports',**dict(filter_query,_anchor='driver-trend')) }}"><label>本人アカウント<select name="reader_username" required><option value="" disabled selected>選択してください</option>{% for user in reader_users %}<option value="{{ user.username }}">{{ user.last_name }}{{ user.first_name or '' }}（{{ user.username }}）</option>{% endfor %}<option value="__revoke__">設定を解除・非公開にする</option></select></label><button class="btn btn-outline" type="submit">対象{{ insights.reader_count }}件の乗務員を保存</button></form></details>{% endif %}
