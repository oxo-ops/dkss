{% set master_nav = [
    ('/master/drivers', 'ドライバーマスタ'),
    ('/master/offices', '営業所マスタ'),
    ('/master/vehicles', '車両マスタ'),
    ('/master/vehicle-types', '車種マスタ'),
    ('/master/license-types', '免許種別マスタ'),
    ('/master/delivery-places', '納入先マスタ')
] %}

<nav class="master-unified-tabs" aria-label="マスタ管理の切替">
    {% for href, caption in master_nav %}
    <a
        href="{{ href }}"
        class="master-unified-tab{% if request.path == href or request.path.startswith(href + '/') %} is-current{% endif %}"
        {% if request.path == href or request.path.startswith(href + '/') %}aria-current="page"{% endif %}
    >
        {{ caption }}
    </a>
    {% endfor %}
</nav>
