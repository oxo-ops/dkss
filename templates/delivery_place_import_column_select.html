{% extends "base.html" %}

{% block title %}納入先Excel列選択{% endblock %}

{% block content %}

<div class="page-header">
    <h2>納入先Excel列選択</h2>

    <a
        href="/master/delivery-places/import"
        class="btn btn-back"
    >
        ← Excel選択へ戻る
    </a>
</div>

<div class="card">

    <p>
        {{ message }}
    </p>

    <p>
        納入先名が入っている列を選択してください。
    </p>

    <form
        method="post"
        action="/master/delivery-places/import/column-select"
    >
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <input
            type="hidden"
            name="rows_json"
            value='{{ rows_json | e }}'
        >

        <input
            type="hidden"
            name="start_row"
            value="{{ start_row }}"
        >

        <div class="delivery-column-list">

            {% for column in columns %}

            <label class="delivery-column-option">

                <input
                    type="radio"
                    name="delivery_column"
                    value="{{ column.column }}"
                    required
                >

                <strong>
                    {{ column.column }}列目
                </strong>

                {% if column.samples %}

                <span class="delivery-column-sample">
                    例：
                    {{ column.samples | join(" / ") }}
                </span>

                {% endif %}

            </label>

            {% endfor %}

        </div>

        <div class="delivery-column-actions">

            <button
                type="submit"
                class="btn btn-primary"
            >
                この列を納入先として読み込む
            </button>

        </div>

    </form>

</div>

{% endblock %}
